[package]
  name = "fmail-sender"
  version = "7.3.4"
  description = "FMailSender — Professional Email Campaign Tool"
  authors = ["FTPLabs"]
  edition = "2021"

  [[bin]]
  name = "fmail-sender"
  path = "src/main.rs"

  [build-dependencies]
  tauri-build = { version = "2", features = [] }

  [dependencies]
  tauri               = { version = "2" }
  tauri-plugin-shell  = "2"
  tauri-plugin-dialog = "2"
  tauri-plugin-fs     = "2"
  serde               = { version = "1", features = ["derive"] }
  serde_json          = "1"
  # Pin time to avoid breaking API change in 0.3.52 (released 2026-06-30):
  # cookie 0.18.1 calls Parsable::parse() with 1 arg; time 0.3.52 requires 2.
  time                = { version = "=0.3.51" }

  [features]
  default          = ["custom-protocol"]
  custom-protocol  = ["tauri/custom-protocol"]

  [profile.release]
  panic         = "abort"
  codegen-units = 1
  lto           = true
  opt-level     = "s"
  strip         = true
