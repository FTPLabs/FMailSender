<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- No-cache: prevents WebView2 from serving stale index.html after an update.
       Each new build produces content-hashed JS chunks, but only if index.html
       is fetched fresh will the browser pick up the new chunk filenames. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <!-- NOTE: Google Fonts CDN intentionally removed.
       Loading from fonts.googleapis.com/fonts.gstatic.com sent the user's real
       IP to Google on every launch, bypassing any VPN or proxy they configured.
       Inter → 'Segoe UI' / system-ui (both are clean, modern sans-serif fonts). -->
  <title>FMail Sender</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
