name: Build FMailSender .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.0.3). Leave empty to skip release.'
        required: false
        default: ''

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Syntax check (py_compile)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "*.py" | Where-Object { $_.FullName -notmatch "venv|site-packages|\.git" } | Select-Object -ExpandProperty FullName
          $failed = @()
          foreach ($f in $files) {
            $out = python -m py_compile "$f" 2>&1
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $f"; Write-Host $out; $failed += $f }
          }
          if ($failed.Count -gt 0) { Write-Error "Syntax errors in $($failed.Count) file(s)"; exit 1 }
          Write-Host "All $($files.Count) Python files OK"

      - name: Import check (core modules)
        run: python -c "import sys; sys.path.insert(0,'.'); from core.sender import Recipient, EmailTemplate, SmtpAccount, SendingEngine, CampaignConfig, SendResult, validate_email_format; from core.license import LicenseInfo, KEY_PREFIX; print('All imports OK')"

      - name: Build .exe
        shell: cmd
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name "FMailSender" ^
            --icon "assets/images/fmail_logo.png" ^
            --add-data "assets;assets" ^
            --add-data "data;data" ^
            --collect-all "PyQt6" ^
            --hidden-import "PyQt6.sip" ^
            --collect-submodules "gui" ^
            --collect-submodules "core" ^
            --hidden-import "gui.screens.screen_accounts" ^
            --hidden-import "gui.screens.screen_activation" ^
            --hidden-import "gui.screens.screen_analytics" ^
            --hidden-import "gui.screens.screen_compose" ^
            --hidden-import "gui.screens.screen_dashboard" ^
            --hidden-import "gui.screens.screen_inbox" ^
            --hidden-import "gui.screens.screen_recipients" ^
            --hidden-import "gui.screens.screen_sending" ^
            --hidden-import "core.license" ^
            --hidden-import "core.sender" ^
            --hidden-import "core.bounce" ^
            --hidden-import "core.spam_checker" ^
            --hidden-import "core.warmup" ^
            --hidden-import "core.ai_fixer" ^
            --hidden-import "core.updater" ^
            main.py

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FMailSender.exe
          generate_release_notes: true
          body: |
            ## FMailSender ${{ github.ref_name }}

            ### Скачать
            Скачайте **FMailSender.exe** ниже и запустите — установка не нужна.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (manual dispatch)
        if: "github.event_name == 'workflow_dispatch' && inputs.tag_name != ''"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/FMailSender.exe
          generate_release_notes: true
          body: |
            ## FMailSender ${{ inputs.tag_name }}

            ### Скачать
            Скачайте **FMailSender.exe** ниже и запустите — установка не нужна.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: FMailSender-windows-exe
          path: dist/FMailSender.exe
          retention-days: 30

  deploy-server:
    runs-on: ubuntu-latest
    if: "github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: 31.76.100.190
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            DEPLOY_DIR=/opt/fmailsender
            [ -d "$DEPLOY_DIR/.git" ] || git clone https://github.com/FTPLabs/FMailSender.git "$DEPLOY_DIR"
            cd "$DEPLOY_DIR" && git pull origin main
            pip3 install -r server/requirements.txt -q
            systemctl restart fmailsender 2>/dev/null || true
            echo "Deployed at $(date)"
