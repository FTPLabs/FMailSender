name: Build FMailSender .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Syntax check (py_compile)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "*.py" | Where-Object { $_.FullName -notmatch "venv|site-packages|\.git" } | Select-Object -ExpandProperty FullName
          $failed = @()
          foreach ($f in $files) {
            $out = python -m py_compile "$f" 2>&1
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: $f"; Write-Host $out; $failed += $f }
          }
          if ($failed.Count -gt 0) { Write-Error "Syntax errors in: $($failed -join ', ')"; exit 1 }
          Write-Host "All $($files.Count) Python files passed syntax check"

      - name: Import check (core modules)
        shell: pwsh
        run: |
          python -c @"
import sys
sys.path.insert(0, '.')
errors = []
modules = [
    'core._version', 'core.sender', 'core.bounce',
    'core.spam_checker', 'core.warmup', 'core.updater', 'core.ai_fixer',
]
for mod in modules:
    try:
        m = __import__(mod, fromlist=[''])
        print(f'OK: {mod}')
    except Exception as e:
        print(f'FAIL: {mod}: {e}')
        errors.append(mod)

# Проверяем конкретные имена которые импортируют экраны
from core.sender import (
    Recipient, EmailTemplate, SmtpAccount, SendingEngine,
    CampaignConfig, SendResult, get_smtp_config_for_domain,
    validate_email_format, test_smtp_connection
)
from core.license import activate_license, generate_hwid, LicenseInfo, KEY_PREFIX
print('Named imports OK')

if errors:
    print(f'FAILED modules: {errors}')
    sys.exit(1)
print('All import checks passed!')
"@

      - name: Build .exe
        shell: cmd
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name "FMailSender" ^
            --icon "assets/images/fmail_logo.png" ^
            --add-data "assets;assets" ^
            --add-data "data;data" ^
            --collect-all "PyQt6" ^
            --hidden-import "PyQt6.sip" ^
            --collect-submodules "gui" ^
            --collect-submodules "core" ^
            --hidden-import "gui.screens.screen_accounts" ^
            --hidden-import "gui.screens.screen_activation" ^
            --hidden-import "gui.screens.screen_analytics" ^
            --hidden-import "gui.screens.screen_compose" ^
            --hidden-import "gui.screens.screen_dashboard" ^
            --hidden-import "gui.screens.screen_inbox" ^
            --hidden-import "gui.screens.screen_recipients" ^
            --hidden-import "gui.screens.screen_sending" ^
            --hidden-import "core.license" ^
            --hidden-import "core.sender" ^
            --hidden-import "core.bounce" ^
            --hidden-import "core.spam_checker" ^
            --hidden-import "core.warmup" ^
            --hidden-import "core.ai_fixer" ^
            --hidden-import "core.updater" ^
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FMailSender-windows-exe
          path: dist/FMailSender.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FMailSender.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-server:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: 31.76.100.190
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            DEPLOY_DIR=/opt/fmailsender
            [ -d "$DEPLOY_DIR/.git" ] || git clone https://github.com/FTPLabs/FMailSender.git "$DEPLOY_DIR"
            cd "$DEPLOY_DIR" && git pull origin main
            pip3 install -r server/requirements.txt -q
            systemctl restart fmailsender 2>/dev/null || (pkill -f "python3 bot.py" 2>/dev/null; sleep 1; nohup python3 bot.py >> /var/log/fmailsender-bot.log 2>&1 &)
            echo "Deployed at $(date)"
