name: Release FMailSender .exe

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.2.3)'
        required: true
        default: 'v3.2.3'
  push:
    tags: ['v*']

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 aiosmtplib cryptography PyJWT dnspython openpyxl reportlab psutil requests Pillow pyinstaller
          pip install wmi pywin32 || echo "wmi/pywin32 optional — skipping"

      - name: Build .exe via build.py
        run: python build.py

      - name: Rename exe with version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag_name }}" -ne "") { "${{ github.event.inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          Copy-Item "dist\FMailSender.exe" "dist\FMailSender_${tag}.exe"
          $size = [math]::Round((Get-Item "dist\FMailSender.exe").Length / 1MB, 1)
          Write-Host "Built: FMailSender_${tag}.exe ($size MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "FMail Sender ${{ github.event.inputs.tag_name || github.ref_name }}"
          files: dist/FMailSender.exe
          body: |
            ## FMail Sender ${{ github.event.inputs.tag_name || github.ref_name }}

            ### Исправления в этой версии
            - Исправлен запуск: `gui.screens.screen_compose` теперь корректно включается в сборку
            - Сборка переведена на `build.py` (spec-файл) — надёжная упаковка всех модулей
            - Исправлена SSL-верификация в `core/license.py` (`_ssl_v` NameError)
            - Исправлен синтаксис `elif` в `core/ai_fixer.py`
            - Исправлен `CancelledError` в `core/sender.py`
            - Исправлен `re.DOTALL` в `core/bounce.py`
            - HTML injection защита в `server/bot.py`

            ### Установка
            Скачайте **FMailSender.exe** и запустите — установка не требуется.
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: FMailSender-windows-${{ github.event.inputs.tag_name || github.ref_name }}
          path: dist/FMailSender.exe
          retention-days: 30
