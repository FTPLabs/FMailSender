name: Build EmailSenderPro Windows .exe

  on:
    push:
      branches: [main]
      tags: ["v*"]
    workflow_dispatch:
      inputs:
        version:
          description: "Version (e.g. 1.0.0)"
          required: false
          default: "1.0.0"

  jobs:
    build-windows:
      runs-on: windows-latest
      timeout-minutes: 60
      permissions:
        contents: write

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Determine version
          id: ver
          shell: pwsh
          run: |
            $v = "${{ inputs.version }}"
            if ("${{ github.ref }}" -like "refs/tags/v*") {
              $v = "${{ github.ref_name }}"
            }
            if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.0.0" }
            $v = $v.TrimStart("v")
            echo "ver=$v" >> $env:GITHUB_OUTPUT
            Write-Host "Building version: $v"

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install dependencies
          shell: pwsh
          run: |
            python -m pip install --upgrade pip wheel setuptools
            pip install "PyQt6==6.7.1"
            pip install "aiosmtplib>=3.0.0"
            pip install "cryptography>=41.0.0"
            pip install "PyJWT>=2.8.0"
            pip install "dnspython>=2.4.0"
            pip install "openpyxl>=3.1.2"
            pip install "reportlab>=4.0.0"
            pip install "psutil>=5.9.0"
            pip install "requests>=2.31.0"
            pip install "pywin32>=306"
            pip install "wmi>=1.5.1"
            pip install "pyinstaller>=6.3.0"

        - name: Run PyInstaller build
          shell: pwsh
          run: python build.py
          env:
            PYTHONIOENCODING: utf-8
            PYTHONUTF8: 1

        - name: List build output
          shell: pwsh
          continue-on-error: true
          run: Get-ChildItem dist -Recurse -Filter "*.exe" | Select-Object FullName, Length

        - name: Package to ZIP
          id: package
          shell: pwsh
          run: |
            $ver = "${{ steps.ver.outputs.ver }}"
            $zipName = "EmailSenderPro-$ver-windows.zip"
            $zipPath = "dist/$zipName"
            $exeDir = "dist/EmailSenderPro/EmailSenderPro.exe"
            $exeOne = "dist/EmailSenderPro.exe"

            if (Test-Path $exeDir) {
              Write-Host "Folder mode — compressing dist/EmailSenderPro/"
              Compress-Archive -Path "dist/EmailSenderPro/*" -DestinationPath $zipPath -Force
            } elseif (Test-Path $exeOne) {
              Write-Host "Single-file mode — compressing EmailSenderPro.exe"
              Compress-Archive -Path $exeOne -DestinationPath $zipPath -Force
            } else {
              Write-Error "EmailSenderPro.exe not found in dist/"
              Get-ChildItem dist/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
              exit 1
            }

            $sizeMB = [math]::Round((Get-Item $zipPath).Length/1MB, 1)
            Write-Host "ZIP: $zipPath ($sizeMB MB)"
            echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
            echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

        - name: Upload portable ZIP artifact
          uses: actions/upload-artifact@v4
          with:
            name: EmailSenderPro-${{ steps.ver.outputs.ver }}-windows
            path: ${{ steps.package.outputs.zip_path }}
            retention-days: 90
            if-no-files-found: error

        - name: Create GitHub Release
          if: startsWith(github.ref, 'refs/tags/v')
          uses: softprops/action-gh-release@v2
          with:
            name: "Email Sender Pro v${{ steps.ver.outputs.ver }}"
            body: |
              ## Email Sender Pro v${{ steps.ver.outputs.ver }}

              ### Установка
              1. Скачайте ZIP-архив ниже
              2. Распакуйте в любую папку
              3. Запустите `EmailSenderPro.exe`

              ### Демо-ключ (без регистрации)
              ```
              ESP-DEMO0-DEMO0-DEMO0-DEMO0
              ```

              ### Что нового
              - Полная поддержка тёмной темы
              - Автообновление при наличии новых версий
              - Шифрование паролей SMTP-аккаунтов (Fernet)
              - Исправлены счётчики лимитов отправки
              - Демо-режим без лицензии
            files: |
              dist/EmailSenderPro-${{ steps.ver.outputs.ver }}-windows.zip
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  