# This workflow (legacy v5 PyQt6 build) is DISABLED.
# The current build pipeline is .github/workflows/release.yml (Tauri v2).
# Renamed to prevent auto-triggering on tag pushes.
name: "Build & Release (Legacy - DISABLED)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type LEGACY to confirm running legacy build"
        required: true

jobs:
  disabled:
    name: "Legacy build disabled"
    runs-on: ubuntu-latest
    steps:
      - name: "This workflow is disabled"
        run: |
          echo "Legacy v5 build disabled. Use release.yml for Tauri v2 build."
          if [ "${{ github.event.inputs.confirm }}" != "LEGACY" ]; then
            echo "Not confirmed. Exiting."
            exit 1
          fi
