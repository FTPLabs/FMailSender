name: Build FMailSender .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build .exe
        shell: cmd
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name "FMailSender" ^
            --icon "assets/images/fmail_logo.png" ^
            --add-data "assets;assets" ^
            --add-data "data;data" ^
            --hidden-import "PyQt6.sip" ^
            --collect-all "PyQt6" ^
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FMailSender-windows-exe
          path: dist/FMailSender.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FMailSender.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-server:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        with:
          host: 31.76.100.190
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            DEPLOY_DIR=/opt/fmailsender
            [ -d "$DEPLOY_DIR/.git" ] || git clone https://github.com/FTPLabs/FMailSender.git "$DEPLOY_DIR"
            cd "$DEPLOY_DIR" && git pull origin main
            cd server && pip3 install -r requirements.txt -q
            pip3 install -r server/requirements.txt -q
            systemctl restart fmailsender 2>/dev/null || (pkill -f "python3 bot.py" 2>/dev/null; sleep 1; nohup python3 bot.py >> /var/log/fmailsender-bot.log 2>&1 &)
            echo "Deployed at $(date)"
