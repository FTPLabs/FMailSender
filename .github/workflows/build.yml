name: Build FMail Sender EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Get version
        id: get_version
        shell: python
        run: |
          import sys, os
          sys.path.insert(0, ".")
          from core._version import APP_VERSION
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={APP_VERSION}\n")

      - name: Build EXE
        env:
          HWID_SALT: ${{ secrets.HWID_SALT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LICENSE_API_URL: ${{ secrets.LICENSE_API_URL }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -X utf8 build.py

      - name: Verify EXE
        run: |
          $exe = Get-Item "dist\FMailSenderPro.exe"
          Write-Host "EXE size: $($exe.Length / 1MB)MB"
          if ($exe.Length -lt 1MB) { exit 1 }
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "FMail Sender Pro ${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          files: dist/FMailSenderPro.exe
          body: |
            ## FMail Sender Pro ${{ steps.get_version.outputs.version }}

            ### Установка
            1. Скачайте `FMailSenderPro.exe`
            2. Запустите файл
            3. Введите лицензионный ключ (получить в боте @FMailSenderBot)

            ### Изменения
            ${{ github.event.head_commit.message }}

            ---
            ⚠️ Автоматическое обновление отключено согласно правилам.
            Новые версии публикуются здесь для свободного скачивания.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
