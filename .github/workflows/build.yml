name: Release FMailSender .exe

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.4.2)'
        required: true
        default: 'v3.4.2'
  push:
    tags: ['v*']

jobs:
  # ══════════════════════════════════════════════════════════════════
  # GATE 1 — Синтаксис + статический анализ (Ubuntu, быстро)
  # ══════════════════════════════════════════════════════════════════
  quality-gates:
    name: Quality Gates (syntax · imports · secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install analysis deps
        run: pip install pyflakes --quiet

      - name: "[GATE-1] Python syntax — py_compile all .py"
        run: |
          echo "=== Gate 1: Syntax Check ==="
          FAILED=0
          while IFS= read -r -d "" f; do
            if ! python3 -m py_compile "$f" 2>/tmp/err; then
              echo "❌ SYNTAX ERROR: $f"
              cat /tmp/err
              FAILED=1
            fi
          done < <(find . -name "*.py" \
              -not -path "./.git/*" \
              -not -path "./__pycache__/*" \
              -not -path "./venv/*" \
              -not -path "./build/*" \
              -print0)
          [ $FAILED -eq 0 ] && echo "✅ Syntax OK" || { echo "❌ Build blocked: syntax errors"; exit 1; }

      - name: "[GATE-2] pyflakes — code analysis (warning)"
        run: |
          echo "=== Gate 2: pyflakes (informational only) ==="
          python3 -m pyflakes . 2>&1 | grep -v "__pycache__" | grep -v ".venv" | grep -v "imported but unused" || true
          echo "✅ pyflakes complete (non-blocking)"

      - name: "[GATE-3] Secret scan — tokens и ключи"
        run: |
          echo "=== Gate 3: Secret Scan ==="
          FAILED=0
          declare -A PATTERNS=(
            ["GitHub token"]="ghp_[A-Za-z0-9]{36}"
            ["GitHub PAT"]="github_pat_[A-Za-z0-9_]{82}"
            ["Telegram token"]="[0-9]{8,12}:[A-Za-z0-9_-]{35}"
            ["OpenAI key"]="sk-[A-Za-z0-9]{48}"
            ["OpenAI proj"]="sk-proj-[A-Za-z0-9_-]{20,}"
            ["AWS key"]="AKIA[0-9A-Z]{16}"
          )
          for name in "${!PATTERNS[@]}"; do
            PAT="${PATTERNS[$name]}"
            FOUND=$(grep -rE "$PAT" --include="*.py" --include="*.json" \
              --exclude-dir=.git --exclude-dir=__pycache__ . 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              echo "❌ CRITICAL: $name found:"
              echo "$FOUND" | head -3
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] && echo "✅ Secret scan OK" || { echo "❌ Build blocked: secrets in code"; exit 1; }

      - name: "[GATE-4] Build Guard — PyInstaller compat"
        run: |
          echo "=== Gate 4: Build Guard ==="
          FAILED=0
          if grep -q "cipher=block_cipher" build.py 2>/dev/null; then
            echo "❌ FAIL: устаревший cipher=block_cipher в build.py"; FAILED=1
          fi
          if grep -q "start_tls=" core/sender.py 2>/dev/null; then
            echo "⚠️  WARN: start_tls= — проверьте aiosmtplib 3.x compat"
          fi
          if grep -rq "datetime.utcnow()" core/ gui/ main.py 2>/dev/null; then
            echo "⚠️ WARN: datetime.utcnow() найден — замени на datetime.now(timezone.utc)"
          fi
          python3 -c "from core._version import APP_VERSION; print(f'Version: {APP_VERSION}')"
          [ $FAILED -eq 0 ] && echo "✅ Build Guard OK" || { echo "❌ Build blocked"; exit 1; }

  # ══════════════════════════════════════════════════════════════════
  # GATE 5-6 — Сборка EXE + Smoke Test (Windows)
  # ══════════════════════════════════════════════════════════════════
  build-release:
    name: Build EXE + Create Release
    runs-on: windows-latest
    needs: quality-gates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine aiosmtplib cryptography PyJWT dnspython openpyxl reportlab psutil requests Pillow pyinstaller
          pip install wmi pywin32 || echo "wmi/pywin32 optional — skipping"

      - name: "[GATE-5] Import verification"
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from core._version import APP_NAME, APP_VERSION
          from core.sender import SendingEngine
          from core.spam_checker import SpamChecker
          from core.ai_fixer import AiSpamFixer
          from core.warmup import WarmupScheduler
          from core.updater import check_for_update, UpdateInfo, Downloader
          print(f'All imports OK — {APP_NAME} v{APP_VERSION}')
          "

      - name: "[GATE-5] Build .exe"
        run: python build.py

      - name: "[GATE-6] Smoke test EXE"
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\FMailSender.exe" `
            -ArgumentList "--check" -PassThru -WindowStyle Hidden
          $proc | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            $proc.Kill()
            Write-Host "PASS: FMailSender.exe launched without crash"
          } elseif ($proc.ExitCode -eq 0) {
            Write-Host "PASS: --check returned 0"
          } else {
            Write-Error "FAIL: ExitCode=$($proc.ExitCode)"
            exit 1
          }

      - name: Rename EXE with version tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag_name }}" -ne "") { "${{ github.event.inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          Copy-Item "dist\FMailSender.exe" "dist\FMailSender_${tag}.exe"
          $size = [math]::Round((Get-Item "dist\FMailSender.exe").Length / 1MB, 1)
          Write-Host "Built: FMailSender_${tag}.exe ($size MB)"

      - name: Generate patch manifest
        shell: bash
        run: |
          NEW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^$NEW_TAG$" | head -1 || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag — skipping patch manifest"
            echo '{"version":"'$(echo $NEW_TAG | sed s/v//)'" ,"base_version":"","files":[]}' > dist/patch_manifest_${NEW_TAG}.json
          else
            echo "Generating patch: $PREV_TAG → $NEW_TAG"
            PYTHONIOENCODING=utf-8 python make_patch.py "$PREV_TAG" "$NEW_TAG"
          fi
          echo "Patch manifest:"
          cat dist/patch_manifest_${NEW_TAG}.json || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "FMail Sender ${{ github.event.inputs.tag_name || github.ref_name }}"
          files: |
            dist/FMailSender.exe
            dist/patch_manifest_*.json
          fail_on_unmatched_files: false
          body: |
            ## FMail Sender ${{ github.event.inputs.tag_name || github.ref_name }}

            ### Установка / обновление
            - **Новая установка:** скачайте **FMailSender.exe** и запустите
            - **Silent patch-обновление:** при запуске приложение само обнаружит обновление
              и скачает только изменённые файлы (~КБ вместо ~МБ полного EXE)

            ### Качество сборки
            ✅ Syntax check пройден
            ✅ Secret scan пройден
            ✅ Import verification пройден
            ✅ Smoke test пройден

            > Релиз создаётся только если **все 6 gate'ов** прошли успешно.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: FMailSender-windows-${{ github.event.inputs.tag_name || github.ref_name }}
          path: dist/FMailSender.exe
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════
  # DEPLOY — VPS (fmail.shop), только если сборка успешна
  # ══════════════════════════════════════════════════════════════════
  deploy-vps:
    name: Deploy to VPS (fmail.shop)
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: SSH Deploy to fmail.shop
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: fmail.shop
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 120s
          script: |
            set -e
            echo "=== FMailSender VPS Deploy ==="
            cd /opt/fmailsender

            git fetch origin
            git reset --hard origin/main
            echo "✅ Code: $(git log --oneline -1)"

            VENV=""
            if [ -f "/opt/fmailsender/venv/bin/pip" ]; then
              VENV="/opt/fmailsender/venv"
            elif [ -f "/opt/fmailsender/server/venv/bin/pip" ]; then
              VENV="/opt/fmailsender/server/venv"
            fi
            if [ -n "$VENV" ]; then
              $VENV/bin/pip install -q --upgrade pip
              $VENV/bin/pip install -q -r server/requirements.txt
              echo "✅ Deps updated"
            else
              echo "⚠️  venv not found — creating"
              python3 -m venv /opt/fmailsender/venv
              /opt/fmailsender/venv/bin/pip install -q -r server/requirements.txt
            fi

            systemctl daemon-reload
            systemctl restart fmailsender
            sleep 4
            STATUS=$(systemctl is-active fmailsender)
            if [ "$STATUS" = "active" ]; then
              echo "✅ fmailsender ACTIVE"
            else
              journalctl -u fmailsender -n 30 --no-pager
              exit 1
            fi
            echo "=== Deploy complete ==="

  # ══════════════════════════════════════════════════════════════════
  # ФИНАЛЬНЫЙ JOB — Возвращает репозиторий в ПРИВАТНЫЙ режим.
  # Запускается ВСЕГДА (даже при ошибке сборки).
  # Требует GitHub Secret: ADMIN_PAT — PAT с правами repo + admin:repo
  # ══════════════════════════════════════════════════════════════════
  restore-privacy:
    name: Restore repo → PRIVATE
    runs-on: ubuntu-latest
    needs: [build-release, deploy-vps]
    if: always()
    steps:
      - name: Make repository private
        env:
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        run: |
          echo "=== Restoring repository visibility to PRIVATE ==="
          if [ -z "$ADMIN_PAT" ]; then
            echo "⚠️  Secret ADMIN_PAT не задан — пропускаем."
            echo "   Добавьте PAT (repo + admin:repo) как секрет ADMIN_PAT в:"
            echo "   GitHub → Settings → Secrets and variables → Actions"
            exit 0
          fi
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PATCH "https://api.github.com/repos/${{ github.repository }}" \
            -H "Authorization: token $ADMIN_PAT" \
            -H "Content-Type: application/json" \
            -d '{"private": true}')
          if [ "$HTTP" = "200" ]; then
            echo "✅ Репозиторий теперь ПРИВАТНЫЙ"
          else
            echo "⚠️  HTTP $HTTP — не удалось вернуть приватность"
            cat /tmp/resp.json || true
            echo "Пожалуйста, вручную переключите репозиторий в приватный режим."
          fi
