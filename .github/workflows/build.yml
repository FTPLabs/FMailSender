name: Build EmailSenderPro Windows .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install all dependencies
        run: |
          pip install PyQt6==6.6.1
          pip install PyQt6-Qt6==6.6.1
          pip install PyQt6-WebEngine==6.6.0
          pip install PyQt6-WebEngine-Qt6==6.6.0
          pip install aiosmtplib>=3.0.0
          pip install cryptography>=41.0.0
          pip install PyJWT>=2.8.0
          pip install dnspython>=2.4.0
          pip install openpyxl>=3.1.2
          pip install reportlab>=4.0.0
          pip install psutil>=5.9.0
          pip install requests>=2.31.0
          pip install pywin32>=306
          pip install wmi>=1.5.1
          pip install pyinstaller>=6.3.0
          pip install pyinstaller-hooks-contrib>=2024.0
        shell: cmd

      - name: Check installed packages
        run: python -m pip list | findstr /I "pyqt pyinstaller crypto jwt dns"
        shell: cmd

      - name: Run PyInstaller build
        run: python build.py
        shell: cmd

      - name: List build output
        run: dir /s /b dist\*.exe
        shell: cmd
        continue-on-error: true

      - name: Verify EXE and package to ZIP
        id: package
        shell: pwsh
        run: |
          $exeDir = "dist\EmailSenderPro\EmailSenderPro.exe"
          $exeOne = "dist\EmailSenderPro.exe"
          $zipPath = "dist\EmailSenderPro-1.0.0-windows.zip"

          if (Test-Path $exeDir) {
            $sz = [math]::Round((Get-Item $exeDir).Length / 1MB, 1)
            Write-Host "EXE (folder mode): $sz MB"
            Compress-Archive -Path "dist\EmailSenderPro\*" -DestinationPath $zipPath -Force
          } elseif (Test-Path $exeOne) {
            $sz = [math]::Round((Get-Item $exeOne).Length / 1MB, 1)
            Write-Host "EXE (onefile mode): $sz MB"
            Compress-Archive -Path $exeOne -DestinationPath $zipPath -Force
          } else {
            Write-Error "EmailSenderPro.exe not found in dist\"
            Get-ChildItem dist\ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

          $zipSz = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "ZIP: $zipPath ($zipSz MB)"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EmailSenderPro-1.0.0-windows-portable
          path: dist/EmailSenderPro-1.0.0-windows.zip
          retention-days: 90
          if-no-files-found: error

      - name: Build Inno Setup Installer
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup --no-progress -y
          if (Test-Path "dist\EmailSenderPro\EmailSenderPro.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss"
            Write-Host "Installer build exit: $LASTEXITCODE"
          } else {
            Write-Host "Skipping installer (no folder build)"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EmailSenderPro-1.0.0-windows-installer
          path: dist/installer/*.exe
          retention-days: 90
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Email Sender Pro ${{ github.ref_name }}
          files: |
            dist/EmailSenderPro-1.0.0-windows.zip
            dist/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
