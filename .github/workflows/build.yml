name: Build EmailSenderPro Windows .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      onefile:
        description: "Build single .exe (true/false)"
        required: false
        default: "false"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip + wheel
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install Python dependencies
        run: |
          pip install PyQt6>=6.6.0
          pip install PyQt6-Qt6>=6.6.0
          pip install PyQt6-WebEngine>=6.6.0
          pip install PyQt6-WebEngine-Qt6>=6.6.0
          pip install aiosmtplib>=3.0.0
          pip install cryptography>=41.0.0
          pip install PyJWT>=2.8.0
          pip install dnspython>=2.4.0
          pip install openpyxl>=3.1.2
          pip install reportlab>=4.0.0
          pip install psutil>=5.9.0
          pip install requests>=2.31.0
          pip install pywin32>=306
          pip install wmi>=1.5.1
          pip install pyinstaller>=6.3.0
          pip install pyinstaller-hooks-contrib>=2024.0

      - name: Verify imports
        run: |
          python -c "import PyQt6; print('PyQt6 OK')"
          python -c "from PyQt6.QtWebEngineWidgets import QWebEngineView; print('WebEngine OK')"
          python -c "import aiosmtplib; print('aiosmtplib OK')"
          python -c "import cryptography; print('cryptography OK')"
        working-directory: email_sender_pro

      - name: Build with PyInstaller
        run: python build.py
        working-directory: email_sender_pro
        shell: cmd

      - name: List dist output
        run: |
          dir /s dist\
        working-directory: email_sender_pro
        shell: cmd
        continue-on-error: true

      - name: Verify EXE exists
        run: |
          if (Test-Path "dist\EmailSenderPro\EmailSenderPro.exe") {
            $size = (Get-Item "dist\EmailSenderPro\EmailSenderPro.exe").Length / 1MB
            Write-Host "✓ EmailSenderPro.exe ($($size.ToString('F1')) MB)"
          } elseif (Test-Path "dist\EmailSenderPro.exe") {
            $size = (Get-Item "dist\EmailSenderPro.exe").Length / 1MB
            Write-Host "✓ EmailSenderPro.exe onefile ($($size.ToString('F1')) MB)"
          } else {
            Write-Error "EXE not found in dist/"
            exit 1
          }
        working-directory: email_sender_pro
        shell: pwsh

      - name: Package to ZIP
        id: package
        run: |
          $ver = "1.0.0"
          $zipName = "EmailSenderPro-$ver-windows.zip"
          if (Test-Path "dist\EmailSenderPro") {
            Compress-Archive -Path "dist\EmailSenderPro\*" -DestinationPath "dist\$zipName" -Force
          } elseif (Test-Path "dist\EmailSenderPro.exe") {
            Compress-Archive -Path "dist\EmailSenderPro.exe" -DestinationPath "dist\$zipName" -Force
          }
          Write-Host "ZIP: dist\$zipName"
          echo "ZIPNAME=$zipName" >> $env:GITHUB_OUTPUT
        working-directory: email_sender_pro
        shell: pwsh

      - name: Build Inno Setup Installer
        run: |
          choco install innosetup --no-progress -y
          if (Test-Path "dist\EmailSenderPro\EmailSenderPro.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\setup.iss"
            if ($LASTEXITCODE -eq 0) { Write-Host "✓ Installer built" }
          }
        working-directory: email_sender_pro
        shell: pwsh
        continue-on-error: true

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EmailSenderPro-portable
          path: email_sender_pro/dist/*.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload installer (if built)
        uses: actions/upload-artifact@v4
        with:
          name: EmailSenderPro-installer
          path: |
            email_sender_pro/dist/installer/*.exe
          retention-days: 90
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Email Sender Pro ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            email_sender_pro/dist/*.zip
            email_sender_pro/dist/installer/*.exe
          body: |
            ## Email Sender Pro ${{ github.ref_name }}
            Скачайте ZIP, распакуйте, запустите EmailSenderPro.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
