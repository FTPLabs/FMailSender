name: Build EmailSenderPro Windows Installer

  on:
    push:
      branches: [main]
      tags: ["v*"]
    workflow_dispatch:
      inputs:
        version:
          description: "Version (e.g. 1.0.0)"
          required: false
          default: "1.0.0"

  jobs:
    build-windows:
      runs-on: windows-latest
      timeout-minutes: 60
      permissions:
        contents: write

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Determine version
          id: ver
          shell: pwsh
          run: |
            $ref = "${{ github.ref }}"
            $v = "${{ inputs.version }}"
            if ($ref -like "refs/tags/v*") { $v = "${{ github.ref_name }}" }
            if ([string]::IsNullOrWhiteSpace($v)) { $v = "1.0.0" }
            $v = $v.TrimStart("v")
            echo "ver=$v" >> $env:GITHUB_OUTPUT
            Write-Host "Building version: $v"

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install Python dependencies
          shell: pwsh
          run: |
            python -m pip install --upgrade pip wheel setuptools
            pip install "PyQt6==6.7.1"
            pip install "aiosmtplib>=3.0.0"
            pip install "cryptography>=41.0.0"
            pip install "PyJWT>=2.8.0"
            pip install "dnspython>=2.4.0"
            pip install "openpyxl>=3.1.2"
            pip install "reportlab>=4.0.0"
            pip install "psutil>=5.9.0"
            pip install "requests>=2.31.0"
            pip install "pywin32>=306"
            pip install "wmi>=1.5.1"
            pip install "pyinstaller>=6.3.0"

        - name: Build exe with PyInstaller
          shell: pwsh
          run: python build.py
          env:
            PYTHONIOENCODING: utf-8
            PYTHONUTF8: 1

        - name: Verify exe exists
          shell: pwsh
          run: |
            $exe = "dist\\EmailSenderPro\\EmailSenderPro.exe"
            if (-not (Test-Path $exe)) {
              Write-Error "EmailSenderPro.exe not found after build!"
              Get-ChildItem dist -Recurse | Select-Object FullName
              exit 1
            }
            $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
            Write-Host "EXE OK: $exe ($sizeMB MB)"

        - name: Install Inno Setup
          shell: pwsh
          run: |
            if (-not (Test-Path "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe")) {
              choco install innosetup --yes --no-progress
            } else {
              Write-Host "Inno Setup already installed"
            }

        - name: Patch version in setup.iss
          shell: pwsh
          run: |
            $ver = "${{ steps.ver.outputs.ver }}"
            $issPath = "installer\\setup.iss"
            (Get-Content $issPath) -replace '#define MyAppVersion.*', "#define MyAppVersion   ""$ver""" | Set-Content $issPath
            Write-Host "Patched version to $ver in setup.iss"

        - name: Build installer with Inno Setup
          shell: pwsh
          run: |
            $iscc = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
            & $iscc "installer\\setup.iss"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Inno Setup failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }

        - name: Verify installer
          shell: pwsh
          id: installer
          run: |
            $ver = "${{ steps.ver.outputs.ver }}"
            $setupExe = "dist\\installer\\EmailSenderPro-$ver-Setup.exe"
            if (-not (Test-Path $setupExe)) {
              Write-Error "Installer not found: $setupExe"
              Get-ChildItem dist\\installer -ErrorAction SilentlyContinue | Select-Object FullName
              exit 1
            }
            $sizeMB = [math]::Round((Get-Item $setupExe).Length / 1MB, 1)
            Write-Host "Installer OK: $setupExe ($sizeMB MB)"
            echo "setup_path=$setupExe" >> $env:GITHUB_OUTPUT
            echo "setup_name=EmailSenderPro-$ver-Setup.exe" >> $env:GITHUB_OUTPUT

        - name: Upload installer artifact
          uses: actions/upload-artifact@v4
          with:
            name: "EmailSenderPro-${{ steps.ver.outputs.ver }}-Setup"
            path: ${{ steps.installer.outputs.setup_path }}
            retention-days: 90
            if-no-files-found: error

        - name: Create GitHub Release
          if: startsWith(github.ref, 'refs/tags/v')
          uses: softprops/action-gh-release@v2
          with:
            name: "Email Sender Pro v${{ steps.ver.outputs.ver }}"
            body: |
              ## Email Sender Pro v${{ steps.ver.outputs.ver }}

              ### Установка
              1. Скачайте **${{ steps.installer.outputs.setup_name }}** ниже
              2. Запустите установщик — он сам всё сделает
              3. Ярлык появится на рабочем столе (если выбрали)

              ### Демо-ключ
              ```
              ESP-DEMO0-DEMO0-DEMO0-DEMO0
              ```
            files: ${{ steps.installer.outputs.setup_path }}
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  