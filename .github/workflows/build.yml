name: Release FMailSender .exe

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v3.2.3)'
        required: true
        default: 'v3.2.3'
  push:
    tags: ['v*']

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine aiosmtplib cryptography PyJWT dnspython openpyxl reportlab psutil requests Pillow pyinstaller
          pip install wmi pywin32 || echo "wmi/pywin32 optional — skipping"

      - name: Verify Python imports before build
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from core._version import APP_NAME, APP_VERSION; from core.sender import SendingEngine; from core.spam_checker import SpamChecker; from core.ai_fixer import AiSpamFixer; from core.warmup import WarmupScheduler; print(f'All imports OK - {APP_NAME} v{APP_VERSION}')"

      - name: Build .exe via build.py
        run: python build.py

      - name: Smoke-test .exe (авто-проверка запуска)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\FMailSender.exe" -ArgumentList "--check" -PassThru -WindowStyle Hidden
          $proc | Wait-Process -Timeout 15 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) {
            $proc.Kill()
            Write-Host "PASS: FMailSender.exe запустился без краша"
          } elseif ($proc.ExitCode -eq 0) {
            Write-Host "PASS: --check вернул 0"
          } else {
            Write-Error "FAIL: ExitCode=$($proc.ExitCode)"
            exit 1
          }

      - name: Rename exe with version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag_name }}" -ne "") { "${{ github.event.inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          Copy-Item "dist\FMailSender.exe" "dist\FMailSender_${tag}.exe"
          $size = [math]::Round((Get-Item "dist\FMailSender.exe").Length / 1MB, 1)
          Write-Host "Built: FMailSender_${tag}.exe ($size MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "FMail Sender ${{ github.event.inputs.tag_name || github.ref_name }}"
          files: dist/FMailSender.exe
          body: |
              ## FMail Sender ${{ github.event.inputs.tag_name || github.ref_name }} — Новый GUI

              ### ✨ Новый Web3/dApp Glassmorphism дизайн
              - Deep space фон (#050510) + violet neon (#8B5CF6) + cyan accent (#06B6D4)
              - Анимированный фон с частицами
              - 7 экранов: Дашборд, Аккаунты, Письмо, Получатели, Рассылка, Аналитика, Ответы
              - KPI-карточки с анимацией, Bézier-графики активности
              - Rich-text редактор с live preview и A/B тестами

              ### 🔧 Исправления сервера
              - Исправлен SSL в сервере лицензий (HTTPS теперь работает)
              - Исправлен ModuleNotFoundError при старте бота
              - Исправлены race conditions, busy_timeout, ai_fixer imports

              ### Установка
              Скачайте **FMailSender.exe** и запустите — установка не требуется.
            fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: FMailSender-windows-${{ github.event.inputs.tag_name || github.ref_name }}
          path: dist/FMailSender.exe
          retention-days: 30
