name: "🚀 Build & Release"

  on:
    push:
      tags:
        - "v*"
    workflow_dispatch:
      inputs:
        version:
          description: "Version (e.g. 6.0.1)"
          required: true
          default: "6.0.0"
        prerelease:
          description: "Pre-release?"
          type: boolean
          default: false

  env:
    PYTHON_VERSION: "3.11"
    NODE_VERSION: "20"

  jobs:
    build:
      name: "Build Windows Installer"
      runs-on: windows-latest
      timeout-minutes: 60

      steps:
        - name: "Checkout"
          uses: actions/checkout@v4

        - name: "Setup Node.js ${{ env.NODE_VERSION }}"
          uses: actions/setup-node@v4
          with:
            node-version: ${{ env.NODE_VERSION }}

        - name: "Setup Python ${{ env.PYTHON_VERSION }}"
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}

        - name: "Setup Rust (stable)"
          uses: dtolnay/rust-toolchain@stable
          with:
            targets: x86_64-pc-windows-msvc

        - name: "Cache Rust build"
          uses: Swatinem/rust-cache@v2
          with:
            workspaces: src-tauri -> target

        - name: "Install Python deps + PyInstaller"
          run: |
            pip install -r requirements.txt pyinstaller
            pip list

        - name: "Build React UI"
          working-directory: ui
          run: |
            npm ci
            npm run build
            echo "UI dist size:"
            du -sh dist

        - name: "Build Python core (PyInstaller → fmail-core.exe)"
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
            pyinstaller fmail-core.spec `
              --distpath "src-tauri/binaries" `
              --workpath "C:/tmp/pyinstaller-build" `
              --noconfirm
            $exe = "src-tauri/binaries/fmail-core.exe"
            if (Test-Path $exe) {
              $sz = (Get-Item $exe).Length / 1MB
              Write-Host "✅ fmail-core.exe: $([math]::Round($sz,1)) MB"
            } else {
              Write-Error "❌ fmail-core.exe not found!"
              exit 1
            }
            # Rename to Tauri sidecar convention: name-target_triple.exe
            Copy-Item $exe "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe"

        - name: "Build Tauri (.exe installer)"
          run: cargo tauri build --verbose
          env:
            TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        - name: "Find build artifacts"
          id: artifacts
          shell: pwsh
          run: |
            $bundle = "src-tauri/target/release/bundle"
            $exe = Get-ChildItem -Path $bundle -Filter "*_x64-setup.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { $exe = Get-ChildItem -Path $bundle -Filter "*.exe" -Recurse | Select-Object -First 1 }
            $msi = Get-ChildItem -Path $bundle -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

            if ($exe) {
              Write-Host "✅ EXE: $($exe.FullName)"
              echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
              echo "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT
            }
            if ($msi) {
              Write-Host "✅ MSI: $($msi.FullName)"
              echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            }

        - name: "Upload build artifacts (always)"
          uses: actions/upload-artifact@v4
          with:
            name: FMailSender-Windows
            path: |
              src-tauri/target/release/bundle/**/*.exe
              src-tauri/target/release/bundle/**/*.msi
            if-no-files-found: warn

        - name: "Create GitHub Release"
          if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
            name: "FMailSender ${{ github.event.inputs.version || github.ref_name }}"
            prerelease: ${{ github.event.inputs.prerelease == 'true' }}
            generate_release_notes: true
            files: |
              ${{ steps.artifacts.outputs.exe_path }}
              ${{ steps.artifacts.outputs.msi_path }}
            body: |
              ## FMailSender ${{ github.event.inputs.version || github.ref_name }}

              ### Установка на Windows

              | Файл | Для кого |
              |------|----------|
              | **FMailSender_*_x64-setup.exe** | Обычная установка (рекомендуется) |
              | **FMailSender_*.msi** | Корпоративный деплой (GPO / SCCM) |

              ### Что внутри
              - 🦀 Tauri v2 (WebView2 — уже встроен в Windows 10/11)
              - ⚡ React + Vite UI — новый дизайн
              - 🐍 Python FastAPI core (в комплекте, не требует установки Python)
              - 📦 Размер установщика: ~20 МБ

              ### Системные требования
              - Windows 10 x64 (сборка 1803+) или Windows 11
              - 100 МБ свободного места
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  