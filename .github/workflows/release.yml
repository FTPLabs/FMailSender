name: "FMailSender Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 6.4.0)"
        required: true
        default: "6.7.0"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PYINSTALLER_VERSION: "6.6.0"

jobs:
  build:
    name: "Build & Release"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:

      - name: "Repo PUBLIC — build window open"
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "${PAT_TOKEN}" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${PAT_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/FTPLabs/FMailSender" \
              -d '{"private":false}' | grep -o '"private":[a-z]*' || true
            echo "Repo: PUBLIC"
          else
            echo "PAT_TOKEN not set — assuming repo is already public"
          fi

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Rust stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: "Rust cache"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: "Resolve version"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"    >> $GITHUB_OUTPUT
          echo "name=FMailSender v${VERSION}" >> $GITHUB_OUTPUT
          echo "Build: FMailSender v${VERSION}"

      - name: "Sync version"
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"

          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          Write-Host "tauri.conf.json => $ver"

          $cargo = Get-Content "src-tauri/Cargo.toml"
          $patched = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $patched -and $_ -match 'version\s*=\s*"') {
              $patched = $true
              "version = `"$ver`""
            } else { $_ }
          }
          $cargo | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          Write-Host "Cargo.toml => $ver"

          Set-Content "core/_version.py"   -Encoding UTF8 "APP_VERSION = `"$ver`""
          Set-Content "ui/src/version.ts"  -Encoding UTF8 "export const FRONTEND_VERSION = `"$ver`""
          Write-Host "Version synced to $ver"

      - name: "Python deps"
        shell: pwsh
        run: |
          pip install -r requirements.txt "pyinstaller==${{ env.PYINSTALLER_VERSION }}" --quiet

      - name: "Python import check"
        shell: pwsh
        run: |
          $checks = @(
            "import core._ensure_imports",
            "from core.server import app",
            "from core.sender import SendingEngine, test_smtp_connection",
            "from core.models import SmtpAccount, Recipient, CampaignConfig, CampaignStatus",
            "from core.storage import save_accounts, load_accounts",
            "from core._version import APP_VERSION",
            "import multipart"
          )
          $failed = $false
          foreach ($c in $checks) {
            $out = python -c $c 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAIL ($LASTEXITCODE): $c  ->  $out"
              $failed = $true
            } else {
              Write-Host "OK  $c"
            }
          }
          if ($failed) { exit 1 }

      - name: "PyInstaller - fmail-core.exe"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          pyinstaller fmail-core.spec `
            --distpath "src-tauri/binaries" `
            --workpath "C:/tmp/pyinstaller-build" `
            --noconfirm

          $exe = "src-tauri/binaries/fmail-core.exe"
          if (-not (Test-Path $exe)) { Write-Error "fmail-core.exe missing"; exit 1 }
          $sz = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($sz -lt 5) { Write-Error "fmail-core.exe too small ($sz MB)"; exit 1 }

          Copy-Item $exe "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "fmail-core.exe = $sz MB OK"

      - name: "UI npm install"
        working-directory: ui
        run: npm install

      - name: "UI Vite build"
        working-directory: ui
        run: npm run build

      - name: "UI verify"
        shell: pwsh
        run: |
          if (-not (Test-Path "ui/dist/index.html")) { Write-Error "ui/dist/index.html missing"; exit 1 }
          Write-Host "ui/dist OK"

      - name: "Tauri CLI"
        run: npm install -g @tauri-apps/cli@^2

      - name: "Tauri icons"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $logo = "assets/images/fmail_logo.png"
          if (Test-Path $logo) { tauri icon $logo }
          else { Write-Warning "Logo not found - using existing icons" }

      - name: "Tauri build - NSIS installer"
        id: tauri_build
        shell: pwsh
        run: |
          tauri build --target x86_64-pc-windows-msvc --verbose 2>&1

          $target = "x86_64-pc-windows-msvc"

          $nsis = Get-ChildItem -Recurse "src-tauri/target" -ErrorAction SilentlyContinue |
            Where-Object { ($_.Name -like "*setup*.exe" -or $_.Name -like "*Setup*.exe") -and $_.Length -gt 5MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $nsis) {
            $nsis = Get-ChildItem -Recurse "src-tauri/target/$target/release/bundle/nsis" `
              -Filter "*.exe" -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }

          $sz = [math]::Round($nsis.Length / 1MB, 1)
          Write-Host "NSIS installer: $($nsis.FullName) ($sz MB)"
          "installer_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          "installer_size=$sz"                >> $env:GITHUB_OUTPUT

          # Find app exe (Cargo bin = fmail-sender, but productName = FMailSender)
          $appExe = Get-ChildItem "src-tauri/target/$target/release" `
            -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 1MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if ($appExe) {
            Write-Host "App exe: $($appExe.FullName) ($([math]::Round($appExe.Length/1MB,1)) MB)"
            "app_exe_path=$($appExe.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "App exe not found in release dir — SFX step will search fallback paths"
          }

      - name: "Install NSIS"
        shell: pwsh
        run: |
          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisExe) {
            Write-Host "NSIS already present"
          } else {
            Write-Host "Installing NSIS via chocolatey..."
            choco install nsis --no-progress -y 2>&1 | Select-Object -Last 5
          }
          & $nsisExe /VERSION

      - name: "Package as portable NSIS launcher"
        id: portable
        shell: pwsh
        run: |
          $ver    = "${{ steps.tag.outputs.version }}"
          $target = "x86_64-pc-windows-msvc"
          $outName = "FMailSender-v$ver.exe"

          New-Item -ItemType Directory -Force -Path "dist_portable" | Out-Null

          $appExePath = "${{ steps.tauri_build.outputs.app_exe_path }}"
          if (-not $appExePath -or -not (Test-Path $appExePath)) {
            $found = Get-ChildItem "src-tauri/target/$target/release" -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 1MB } |
              Sort-Object Length -Descending | Select-Object -First 1
            if (-not $found) { Write-Error "App exe not found"; exit 1 }
            $appExePath = $found.FullName
          }
          Write-Host "App exe: $appExePath"

          $coreExe = "src-tauri/binaries/fmail-core-$target.exe"
          if (-not (Test-Path $coreExe)) { Write-Error "fmail-core sidecar missing"; exit 1 }

          $mainSz = [math]::Round((Get-Item $appExePath).Length / 1MB, 1)
          $coreSz = [math]::Round((Get-Item $coreExe).Length / 1MB, 1)
          Write-Host "App: $mainSz MB | Core: $coreSz MB"
          if ($mainSz -lt 1) { Write-Error "App exe too small"; exit 1 }
          if ($coreSz -lt 5) { Write-Error "Core too small"; exit 1 }

          Copy-Item $appExePath "dist_portable\FMailSender.exe"
          Copy-Item $coreExe   "dist_portable\fmail-core-$target.exe"

          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisExe)) { Write-Error "makensis not found"; exit 1 }

          & $nsisExe /V2 "/DOUTFILE=$outName" "/DTARGET=$target" portable.nsi
          if (-not (Test-Path $outName)) { Write-Error "NSIS build failed"; exit 1 }

          $sz = [math]::Round((Get-Item $outName).Length / 1MB, 1)
          if ($sz -lt 10) { Write-Error "Output too small ($sz MB)"; exit 1 }
          Write-Host "Portable NSIS launcher: $outName ($sz MB)"
          "name=$outName" >> $env:GITHUB_OUTPUT
          "size=$sz"      >> $env:GITHUB_OUTPUT

            - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: false
          generate_release_notes: false
          files: |
            ${{ steps.portable.outputs.name }}
          body: |
            ## ${{ steps.tag.outputs.name }}

            | File | Size | Description |
            |------|------|-------------|
            | `${{ steps.portable.outputs.name }}` | ${{ steps.portable.outputs.size }} MB | **Portable EXE — скачай и запусти, установщик не нужен** |

            ### Запуск
            1. Скачайте `${{ steps.portable.outputs.name }}`
            2. Запустите — приложение стартует автоматически
            3. При первом запуске введите лицензионный ключ

            **Требования:** Windows 10 x64 (build 1803+) или Windows 11 + WebView2 Runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Repo PRIVATE — build window closed"
        if: always()
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "${PAT_TOKEN}" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${PAT_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/FTPLabs/FMailSender" \
              -d '{"private":true}' | grep -o '"private":[a-z]*' || true
            echo "Repo: PRIVATE"
          else
            echo "PAT_TOKEN not set — repo remains public. Set PAT_TOKEN secret for auto-close."
          fi
