name: "Build & Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 6.0.3)"
        required: true
        default: "6.0.3"
      prerelease:
        description: "Pre-release?"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  build:
    name: "Build Windows EXE"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: "Checkout"
        uses: actions/checkout@v4

      # ── Toolchains ──────────────────────────────────────────────────────────
      - name: "Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Setup Rust stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: "Cache Rust"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Determine version ───────────────────────────────────────────────────
      - name: "Resolve version and open Step Summary"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}"           >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"              >> $GITHUB_OUTPUT
          echo "name=FMailSender v${VERSION}" >> $GITHUB_OUTPUT

          # Open progress table in GitHub Step Summary
          {
            echo "## 🚀 FMailSender v${VERSION} — Build Progress"
            echo ""
            echo "| # | Step | Result |"
            echo "|---|------|--------|"
          } >> $GITHUB_STEP_SUMMARY

      # ── Sync version into ALL build manifests ───────────────────────────────
      - name: "Sync version → tauri.conf.json + Cargo.toml + _version.py + version.ts"
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"

          # tauri.conf.json — update "version" field
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          Write-Host "tauri.conf.json → version = $ver"

          # Cargo.toml — replace first version = "..." line in [package]
          $cargo = Get-Content "src-tauri/Cargo.toml"
          $patched = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $patched -and $_ -match '^version\s*=\s*"') {
              $patched = $true
              "version = `"$ver`""
            } else { $_ }
          }
          $cargo | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          Write-Host "Cargo.toml     → version = $ver"

          # core/_version.py — single source of truth for Python backend
          Set-Content "core/_version.py" -Encoding UTF8 -Value @"
"""
FMailSender — Application version (single source of truth).
Imported by core/server.py and build pipeline.
"""
APP_VERSION = "$ver"
"@
          Write-Host "core/_version.py → APP_VERSION = $ver"

          # ui/src/version.ts — single source of truth for JS frontend
          # Used by StartupOverlay to detect stale WebView2 cache after updates.
          Set-Content "ui/src/version.ts" -Encoding UTF8 -Value @"
/**
 * FMailSender — Frontend build version.
 *
 * Must stay in sync with core/_version.py (APP_VERSION).
 * Updated automatically by the release pipeline on every version tag.
 *
 * Used by StartupOverlay to detect a stale WebView2 cache:
 * if the backend reports a different version, it means the old index.html
 * was loaded from cache → force window.location.reload() to get fresh files.
 */
export const FRONTEND_VERSION = "$ver"
"@
          Write-Host "ui/src/version.ts → FRONTEND_VERSION = $ver"

          "| 1 | Version sync → **v$ver** (all manifests) | ✅ |" >> $env:GITHUB_STEP_SUMMARY

      # ── Python deps & verification ──────────────────────────────────────────
      - name: "Install Python deps"
        run: pip install -r requirements.txt pyinstaller --quiet

      - name: "Verify Python imports"
        shell: pwsh
        run: |
          $checks = @(
            "import core._ensure_imports",
            "from core.server import app",
            "from core.sender import SendingEngine, test_smtp_connection",
            "from core.models import SmtpAccount, Recipient, CampaignConfig, CampaignStatus",
            "from core.storage import save_accounts, load_accounts",
            "from core._version import APP_VERSION",
            "import multipart",
            "import email.mime.text, email.mime.multipart, email.mime.application"
          )
          $failed = $false
          foreach ($c in $checks) {
            try {
              python -c $c 2>&1 | Out-Null
              Write-Host "OK  $c"
            } catch {
              Write-Error "FAIL: $c"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          "| 2 | Python import verification | ✅ |" >> $env:GITHUB_STEP_SUMMARY

      # ── Build Python core (PyInstaller) ─────────────────────────────────────
      - name: "PyInstaller — build fmail-core.exe"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          pyinstaller fmail-core.spec `
            --distpath "src-tauri/binaries" `
            --workpath "C:/tmp/pyinstaller-build" `
            --noconfirm

          $exe = "src-tauri/binaries/fmail-core.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "FAIL: fmail-core.exe not found after PyInstaller"
            exit 1
          }
          $sz = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "fmail-core.exe = $sz MB"
          if ($sz -lt 5) {
            Write-Error "FAIL: fmail-core.exe suspiciously small ($sz MB)"
            exit 1
          }

          # Tauri sidecar naming convention (target-triple suffix)
          Copy-Item $exe "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "Sidecar copy done"

          "| 3 | PyInstaller → fmail-core.exe ($sz MB) | ✅ |" >> $env:GITHUB_STEP_SUMMARY

      # ── Build React UI ──────────────────────────────────────────────────────
      - name: "npm install (UI)"
        working-directory: ui
        run: npm install

      - name: "Vite build (UI)"
        working-directory: ui
        run: npm run build

      - name: "Verify ui/dist/"
        shell: pwsh
        run: |
          if (-not (Test-Path "ui/dist/index.html")) {
            Write-Error "FAIL: ui/dist/index.html missing after build"
            exit 1
          }
          $sz = [math]::Round((Get-ChildItem "ui/dist" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "ui/dist/ = $sz MB total"
          "| 4 | React UI built ($sz MB) | ✅ |" >> $env:GITHUB_STEP_SUMMARY

      # ── Tauri CLI & icons ───────────────────────────────────────────────────
      - name: "Install Tauri CLI"
        run: npm install -g @tauri-apps/cli@^2

      - name: "Generate Tauri icons"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $logo = "assets/images/fmail_logo.png"
          if (Test-Path $logo) {
            tauri icon $logo
            Write-Host "Icons generated from $logo"
          } else {
            Write-Warning "Logo not found at $logo — using existing icons in src-tauri/icons/"
          }

      # ── Build Tauri NSIS installer (full bundle) ────────────────────────────
      - name: "tauri build — NSIS installer"
        id: tauri_build
        shell: pwsh
        run: |
          tauri build --target x86_64-pc-windows-msvc --verbose 2>&1

          # Locate installer (Tauri v2 bundles to different paths by target)
          $installer = Get-ChildItem -Recurse "src-tauri/target" `
            -Include "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*setup*" -or $_.Name -like "*Setup*" -or $_.Name -like "*_en-US.exe" } |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "FAIL: NSIS installer not found in src-tauri/target"
            exit 1
          }

          $sz = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer: $($installer.FullName) ($sz MB)"

          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "installer_size=$sz"                    >> $env:GITHUB_OUTPUT
          "| 5 | Tauri NSIS installer ($sz MB) | ✅ |" >> $env:GITHUB_STEP_SUMMARY

      # ── Name the installer ──────────────────────────────────────────────────
      - name: "Copy installer to workspace root"
        id: installer
        shell: pwsh
        run: |
          $src  = "${{ steps.tauri_build.outputs.installer_path }}"
          $ver  = "${{ steps.tag.outputs.version }}"
          $name = "FMailSender-v${ver}-setup.exe"
          Copy-Item $src $name -Force
          Write-Host "Installer → $name"
          "name=$name" >> $env:GITHUB_OUTPUT
          "| 6 | Installer renamed → $name | ✅ |" >> $env:GITHUB_STEP_SUMMARY

      # ── Portable build ──────────────────────────────────────────────────────
      - name: "Build portable archive"
        id: portable
        shell: pwsh
        run: |
          $ver  = "${{ steps.tag.outputs.version }}"
          $name = "FMailSender-v${ver}-portable.zip"

          # Locate the built NSIS exe (same as the installer, just repackaged)
          $exe = "${{ steps.tauri_build.outputs.installer_path }}"

          # Build a flat portable folder: the exe + sidecar + README
          New-Item -ItemType Directory -Force -Path "portable_tmp" | Out-Null
          Copy-Item $exe             "portable_tmp\FMailSender.exe"    -Force
          Copy-Item "src-tauri\binaries\fmail-core-x86_64-pc-windows-msvc.exe" `
                    "portable_tmp\"  -ErrorAction SilentlyContinue

          # Create zip
          Compress-Archive -Path "portable_tmp\*" -DestinationPath $name -Force
          $sz = [math]::Round((Get-Item $name).Length / 1MB, 1)
          Write-Host "Portable → $name ($sz MB)"

          "name=$name" >> $env:GITHUB_OUTPUT
          "size=$sz"   >> $env:GITHUB_OUTPUT
          "| 7 | Portable archive ($sz MB) | ✅ |" >> $env:GITHUB_STEP_SUMMARY

      # ── GitHub Release ──────────────────────────────────────────────────────
      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.installer.outputs.name }}
            ${{ steps.portable.outputs.name }}
          body: |
            ## ${{ steps.tag.outputs.name }}

            ### 📥 Скачать

            | Файл | Размер | Описание |
            |------|--------|----------|
            | **`${{ steps.installer.outputs.name }}`** | ${{ steps.tauri_build.outputs.installer_size }} МБ | Установщик (рекомендуется) |
            | **`${{ steps.portable.outputs.name }}`** | ${{ steps.portable.outputs.size }} МБ | Портативная версия (без установки) |

            ### Установщик (рекомендуется)
            - Запускает мастер установки
            - Устанавливает в `%LOCALAPPDATA%\Programs\FMailSender`
            - Создаёт ярлыки на рабочем столе и в меню Пуск

            ### Портативная версия
            - Скачайте и запустите — установка не нужна
            - Реестр не изменяется
            - Python не нужен — всё встроено внутри

            ### Системные требования
            - Windows 10 x64 (сборка 1803+) или Windows 11
            - WebView2 Runtime (предустановлен на Win11; на Win10 — [скачать](https://go.microsoft.com/fwlink/p/?LinkId=2124703))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Final Step Summary ──────────────────────────────────────────────────
      - name: "Close Step Summary"
        if: always()
        shell: bash
        run: |
          VER="${{ steps.tag.outputs.version }}"
          INSTALLER="${{ steps.installer.outputs.name }}"
          PORTABLE="${{ steps.portable.outputs.name }}"
          {
            echo ""
            echo "---"
            echo "**Version:** v${VER}"
            if [ -n "$INSTALLER" ]; then echo "**Installer:** \`${INSTALLER}\`"; fi
            if [ -n "$PORTABLE" ]; then echo "**Portable:**  \`${PORTABLE}\`"; fi
          } >> $GITHUB_STEP_SUMMARY
