name: "FMailSender Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 6.4.0)"
        required: true
        default: "6.4.0"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PYINSTALLER_VERSION: "6.6.0"

jobs:
  build:
    name: "Build & Release"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Rust stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: "Rust cache"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: "Resolve version"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"    >> $GITHUB_OUTPUT
          echo "name=FMailSender v${VERSION}" >> $GITHUB_OUTPUT
          echo "Build: FMailSender v${VERSION}"

      - name: "Sync version"
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"

          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          Write-Host "tauri.conf.json => $ver"

          $cargo = Get-Content "src-tauri/Cargo.toml"
          $patched = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $patched -and $_ -match '^version\s*=\s*"') {
              $patched = $true
              "version = `"$ver`""
            } else { $_ }
          }
          $cargo | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          Write-Host "Cargo.toml => $ver"

          Set-Content "core/_version.py"   -Encoding UTF8 "APP_VERSION = `"$ver`""
          Set-Content "ui/src/version.ts"  -Encoding UTF8 "export const FRONTEND_VERSION = `"$ver`""
          Write-Host "Version synced to $ver"

      - name: "Python deps"
        shell: pwsh
        run: |
          pip install -r requirements.txt "pyinstaller==${{ env.PYINSTALLER_VERSION }}" --quiet

      - name: "Python import check"
        shell: pwsh
        run: |
          $checks = @(
            "import core._ensure_imports",
            "from core.server import app",
            "from core.sender import SendingEngine, test_smtp_connection",
            "from core.models import SmtpAccount, Recipient, CampaignConfig, CampaignStatus",
            "from core.storage import save_accounts, load_accounts",
            "from core._version import APP_VERSION",
            "import multipart"
          )
          $failed = $false
          foreach ($c in $checks) {
            $out = python -c $c 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAIL ($LASTEXITCODE): $c  ->  $out"
              $failed = $true
            } else {
              Write-Host "OK  $c"
            }
          }
          if ($failed) { exit 1 }

      - name: "PyInstaller - fmail-core.exe"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          pyinstaller fmail-core.spec `
            --distpath "src-tauri/binaries" `
            --workpath "C:/tmp/pyinstaller-build" `
            --noconfirm

          $exe = "src-tauri/binaries/fmail-core.exe"
          if (-not (Test-Path $exe)) { Write-Error "fmail-core.exe missing"; exit 1 }
          $sz = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($sz -lt 5) { Write-Error "fmail-core.exe too small ($sz MB)"; exit 1 }

          Copy-Item $exe "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "fmail-core.exe = $sz MB OK"

      - name: "UI npm install"
        working-directory: ui
        run: npm install

      - name: "UI Vite build"
        working-directory: ui
        run: npm run build

      - name: "UI verify"
        shell: pwsh
        run: |
          if (-not (Test-Path "ui/dist/index.html")) { Write-Error "ui/dist/index.html missing"; exit 1 }
          Write-Host "ui/dist OK"

      - name: "Tauri CLI"
        run: npm install -g @tauri-apps/cli@^2

      - name: "Tauri icons"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $logo = "assets/images/fmail_logo.png"
          if (Test-Path $logo) { tauri icon $logo }
          else { Write-Warning "Logo not found - using existing icons" }

      - name: "Tauri build - NSIS installer"
        id: tauri_build
        shell: pwsh
        run: |
          tauri build --target x86_64-pc-windows-msvc --verbose 2>&1

          $nsis = Get-ChildItem -Recurse "src-tauri/target" -ErrorAction SilentlyContinue |
            Where-Object { ($_.Name -like "*setup*.exe" -or $_.Name -like "*Setup*.exe") -and $_.Length -gt 5MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $nsis) {
            $nsis = Get-ChildItem -Recurse "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" `
              -Filter "*.exe" -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }

          $sz = [math]::Round($nsis.Length / 1MB, 1)
          Write-Host "NSIS installer: $($nsis.FullName) ($sz MB)"
          "installer_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          "installer_size=$sz"                >> $env:GITHUB_OUTPUT

          $appExe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" `
            -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 1MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if ($appExe) {
            "app_exe_path=$($appExe.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: "Package as portable SFX"
        id: portable
        shell: pwsh
        run: |
          $ver    = "${{ steps.tag.outputs.version }}"
          $target = "x86_64-pc-windows-msvc"
          $mainExe = "src-tauri/target/$target/release/FMailSender.exe"
          $coreExe = "src-tauri/binaries/fmail-core-$target.exe"
          if (-not (Test-Path $mainExe)) { Write-Error "FMailSender.exe missing"; exit 1 }
          if (-not (Test-Path $coreExe)) { Write-Error "fmail-core missing"; exit 1 }
          $mainSz = [math]::Round((Get-Item $mainExe).Length / 1MB, 1)
          $coreSz = [math]::Round((Get-Item $coreExe).Length / 1MB, 1)
          Write-Host "App: $mainSz MB | Core: $coreSz MB"
          if ($mainSz -lt 1) { Write-Error "App too small"; exit 1 }
          if ($coreSz -lt 5) { Write-Error "Core too small"; exit 1 }
          New-Item -ItemType Directory -Force -Path "staging" | Out-Null
          Copy-Item $mainExe "staging/FMailSender.exe"
          Copy-Item $coreExe "staging/fmail-core-$target.exe"
          $7z = "C:\Program Files\7-Zip\7z.exe"
          & $7z a -t7z -mx=5 "app-files.7z" "staging/*" 2>&1 | Write-Host
          $cfg  = ";!@Install@!UTF-8!`nTitle=`"FMailSender`"`nRunProgram=`"FMailSender.exe`"`n;!@InstallEnd@!"
          [System.IO.File]::WriteAllText("sfx.cfg", $cfg, [System.Text.Encoding]::UTF8)
          $sfx     = "C:\Program Files\7-Zip\7z.sfx"
          $outName = "FMailSender-v$ver.exe"
          cmd /c "copy /b `"$sfx`" + `"sfx.cfg`" + `"app-files.7z`" `"$outName`" /y"
          if (-not (Test-Path $outName)) { Write-Error "SFX creation failed"; exit 1 }
          $sz = [math]::Round((Get-Item $outName).Length / 1MB, 1)
          if ($sz -lt 10) { Write-Error "SFX too small ($sz MB)"; exit 1 }
          Write-Host "Portable EXE: $outName ($sz MB)"
          "name=$outName" >> $env:GITHUB_OUTPUT
          "size=$sz"      >> $env:GITHUB_OUTPUT

      - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: false
          generate_release_notes: false
          files: |
            ${{ steps.portable.outputs.name }}
          body: |
            ## ${{ steps.tag.outputs.name }}

            | File | Size | Description |
            |------|------|-------------|
            | `${{ steps.portable.outputs.name }}` | ${{ steps.portable.outputs.size }} MB | **Single EXE installer - download and run** |

            ### How to install
            1. Download `${{ steps.portable.outputs.name }}`
            2. Run it and follow the installer steps
            3. Launch **FMailSender** from the desktop shortcut

            **Requirements:** Windows 10 x64 (build 1803+) or Windows 11 + WebView2 Runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
