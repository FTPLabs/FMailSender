name: "FMailSender Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 7.3.5)"
        required: true
        default: "7.3.5"

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: "Build & Release (Electron + Node.js)"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      # ── Version sync ─────────────────────────────────────────────────────────

      - name: "Resolve version"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"    >> $GITHUB_OUTPUT
          echo "name=FMailSender v${VERSION}" >> $GITHUB_OUTPUT
          echo "Build: FMailSender v${VERSION}"

      - name: "Sync version across all files"
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"

          # electron/package.json
          $ep = Get-Content "electron/package.json" -Raw | ConvertFrom-Json
          $ep.version = $ver
          $ep | ConvertTo-Json -Depth 10 | Set-Content "electron/package.json" -Encoding UTF8

          # backend/package.json
          $bp = Get-Content "backend/package.json" -Raw | ConvertFrom-Json
          $bp.version = $ver
          $bp | ConvertTo-Json -Depth 10 | Set-Content "backend/package.json" -Encoding UTF8

          # ui/package.json
          (Get-Content "ui/package.json" -Raw) -replace '"version": "[^"]*"', ('"version": "' + $ver + '"') |
            Set-Content "ui/package.json" -Encoding UTF8

          # ui/src/version.ts
          Set-Content "ui/src/version.ts" -Encoding UTF8 "export const FRONTEND_VERSION = `"$ver`""

          # core/_version.py (kept for reference / VPS bot)
          Set-Content "core/_version.py" -Encoding UTF8 "APP_VERSION = `"$ver`""

          Write-Host "Version synced: $ver" -ForegroundColor Green

      # ── BUILD STEP 1: Install backend dependencies ──────────────────────────

      - name: "Install backend Node.js dependencies"
        shell: pwsh
        working-directory: backend
        run: |
          Write-Host "=== Installing backend deps ===" -ForegroundColor Cyan
          npm ci --prefer-offline 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { npm install }
          if ($LASTEXITCODE -ne 0) { Write-Error "backend npm install failed"; exit 1 }
          Write-Host "Backend deps OK" -ForegroundColor Green

      - name: "Test backend imports (Node.js --test flag)"
        shell: pwsh
        working-directory: backend
        run: |
          Write-Host "=== Testing backend startup ===" -ForegroundColor Cyan
          $proc = Start-Process -FilePath "node" `
                                -ArgumentList "src/server.js", "--test" `
                                -PassThru -Wait -WindowStyle Hidden `
                                -RedirectStandardOutput "test_out.txt" `
                                -RedirectStandardError  "test_err.txt"
          $out = Get-Content "test_out.txt" -ErrorAction SilentlyContinue
          $err = Get-Content "test_err.txt" -ErrorAction SilentlyContinue
          Write-Host "STDOUT: $out"
          if ($proc.ExitCode -eq 0) {
            Write-Host "Backend test PASSED" -ForegroundColor Green
          } else {
            Write-Host "STDERR: $err"
            Write-Error "Backend test FAILED (exit $($proc.ExitCode))"
            exit 1
          }

      # ── BUILD STEP 2: React / Vite UI ────────────────────────────────────────

      - name: "Install UI deps"
        shell: pwsh
        working-directory: ui
        run: |
          npm install 2>&1 | Select-Object -Last 5
          Write-Host "UI deps OK" -ForegroundColor Green

      - name: "Build UI (Vite)"
        shell: pwsh
        working-directory: ui
        run: |
          npm run build
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "UI build failed — dist/index.html missing"
            exit 1
          }
          $sz = [math]::Round((Get-ChildItem "dist" -Recurse | Measure-Object -Property Length -Sum).Sum / 1KB)
          Write-Host "UI build OK — dist: ${sz} KB" -ForegroundColor Green

      # ── BUILD STEP 3: Electron ────────────────────────────────────────────────

      - name: "Install Electron + electron-builder deps"
        shell: pwsh
        working-directory: electron
        run: |
          Write-Host "=== Installing Electron deps ===" -ForegroundColor Cyan
          npm ci --prefer-offline 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { npm install }
          if ($LASTEXITCODE -ne 0) { Write-Error "electron npm install failed"; exit 1 }
          Write-Host "Electron deps OK" -ForegroundColor Green

      - name: "Build portable EXE (electron-builder)"
        id: build_exe
        shell: pwsh
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "=== Building portable EXE ===" -ForegroundColor Cyan

          # electron-builder reads package.json in CWD (electron/)
          # extraResources pulls in ../backend and ../ui/dist
          npx electron-builder --win portable --x64 --publish never

          $ver     = "${{ steps.tag.outputs.version }}"
          $exeName = "FMailSender_v${ver}.exe"
          $rawExe  = "dist-electron/${exeName}"

          if (-not (Test-Path $rawExe)) {
            # try alt path
            $rawExe = Get-ChildItem "dist-electron" -Filter "*.exe" -Recurse |
                      Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $rawExe -or -not (Test-Path $rawExe)) {
            Write-Error "EXE not found in dist-electron/"
            Get-ChildItem "dist-electron" -Recurse | Select-Object FullName
            exit 1
          }

          $sizeMb = [math]::Round((Get-Item $rawExe).Length / 1MB, 1)
          Write-Host "EXE: $rawExe  (${sizeMb} MB)" -ForegroundColor Green

          if ($sizeMb -lt 50) {
            Write-Error "EXE too small (${sizeMb} MB) — bundle may be incomplete"
            exit 1
          }

          # Copy to repo root for release upload (electron/ is one level deep)
          Copy-Item $rawExe "../$exeName" -Force
          Write-Host "Portable EXE ready: $exeName" -ForegroundColor Green

          echo "name=$exeName"    >> $env:GITHUB_OUTPUT
          echo "size=$sizeMb"     >> $env:GITHUB_OUTPUT

      # ── BUILD STEP 4: Verify ─────────────────────────────────────────────────

      - name: "Verify final artifacts"
        shell: pwsh
        run: |
          $exeName = "${{ steps.build_exe.outputs.name }}"
          $errors  = @()

          if (Test-Path $exeName) {
            $sz = [math]::Round((Get-Item $exeName).Length / 1MB, 1)
            Write-Host "[OK] $exeName (${sz} MB)" -ForegroundColor Green
            if ($sz -lt 50) { $errors += "EXE too small (${sz} MB)" }
          } else { $errors += "EXE not found: $exeName" }

          if (Test-Path "ui/dist/index.html") {
            Write-Host "[OK] ui/dist/index.html" -ForegroundColor Green
          } else { $errors += "ui/dist/index.html missing" }

          if (Test-Path "backend/node_modules") {
            Write-Host "[OK] backend/node_modules" -ForegroundColor Green
          } else { $errors += "backend/node_modules missing" }

          if ($errors.Count -eq 0) {
            Write-Host "=== ALL CHECKS PASSED ===" -ForegroundColor Green
          } else {
            $errors | ForEach-Object { Write-Host "[FAIL] $_" -ForegroundColor Red }
            Write-Error "Verification failed"
            exit 1
          }

      - name: "Windows startup smoke-test (packaged EXE)"
        shell: pwsh
        run: |
          $exeName = "${{ steps.build_exe.outputs.name }}"
          $dataDir = Join-Path $env:RUNNER_TEMP "fmailsender-smoke-data"
          Remove-Item -Recurse -Force $dataDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $env:FMAIL_DATA_DIR = $dataDir
          $process = Start-Process -FilePath (Join-Path $PWD $exeName) -ArgumentList "--disable-gpu" -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $health = $null
          try {
            do {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:7531/api/health" -TimeoutSec 3
              } catch {
                $health = $null
              }
            } while (-not $health -and (Get-Date) -lt $deadline)

            if (-not $health -or $health.ok -ne $true -or $health.version -ne "${{ steps.tag.outputs.version }}") {
              throw "Packaged EXE did not expose a valid health endpoint within 90 seconds."
            }
            Write-Host "[OK] Packaged EXE health: version=$($health.version)" -ForegroundColor Green
            $statusProbe = Invoke-WebRequest -Uri "http://127.0.0.1:7531/api/status" -SkipHttpErrorCheck -TimeoutSec 5
            if ($statusProbe.StatusCode -ne 403) {
              throw "Expected license-protected status endpoint to return 403 before activation; got $($statusProbe.StatusCode)."
            }
            $rootProbe = Invoke-WebRequest -Uri "http://127.0.0.1:7531/" -TimeoutSec 5
            if ($rootProbe.StatusCode -ne 200 -or $rootProbe.Content -notmatch '<!doctype html>') {
              throw "Packaged backend did not serve the UI root page."
            }
            Write-Host "[OK] Backend status guard and UI root page" -ForegroundColor Green
            $invalidActivation = Invoke-WebRequest -Uri "http://127.0.0.1:7531/api/license/activate" -Method POST -ContentType "application/json" -Body '{"key":"FMSND-000000-000000-000000-000000"}' -SkipHttpErrorCheck -TimeoutSec 20
            if ($invalidActivation.StatusCode -ne 400 -or $invalidActivation.Content -notmatch 'License not found') {
              throw "Packaged activation transport failed: expected the production API error to pass through local backend; got HTTP $($invalidActivation.StatusCode): $($invalidActivation.Content)"
            }
            Write-Host "[OK] Packaged license activation transport" -ForegroundColor Green
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item -Recurse -Force $dataDir -ErrorAction SilentlyContinue
          }

      # ── GitHub Release ────────────────────────────────────────────────────────

      - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.tag.outputs.tag }}
          name:       "${{ steps.tag.outputs.name }}"
          draft:      false
          prerelease: false
          generate_release_notes: false
          body: |
            ## ${{ steps.tag.outputs.name }}

            ### Установка (без установщика)
            1. Скачайте **FMailSender_v${{ steps.tag.outputs.version }}.exe**
            2. Запустите — приложение откроется мгновенно

            ### Архитектура v7.3.5 (Electron + Node.js — новое ядро)
            - **Electron** — Chromium WebView + Node.js runtime (нет AV-блокировок)
            - **Node.js backend** — Express сервер, запускается за ~200 мс (vs 60 с у Python)
            - **Nodemailer** — нативная SMTP-отправка с поддержкой SOCKS5/HTTP прокси
            - **Бесконечная загрузка полностью устранена** — ядро стартует мгновенно
            - Шифрование паролей: AES-256-GCM (Node.js crypto)
            - Лицензирование: HWID через Windows Registry, онлайн-валидация

            ### Требования
            - Windows 10/11 x64
            - ~250 МБ свободного места (при первом запуске Electron извлекает себя)

          files: ${{ steps.build_exe.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: "Deploy to VPS (fmail.shop)"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: read
    steps:
      - name: "SSH deploy to VPS"
        uses: appleboy/ssh-action@v1.2.5
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port:     22
          timeout:  120s
          script: |
            set -e
            cd /opt/fmailsender
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            echo "Code updated: $(git log --oneline -1)"
            /opt/fmailsender/venv/bin/pip install -q -r server/requirements.txt
            if systemctl is-active --quiet fmailsender; then
              systemctl restart fmailsender
              sleep 4
              systemctl is-active --quiet fmailsender || {
                echo 'Service FAILED to restart'
                journalctl -u fmailsender -n 20 --no-pager
                exit 1
              }
              for i in 1 2 3 4 5; do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8000/health || echo '000')
                if [ "${HTTP_CODE}" = "200" ]; then echo "✅ HTTP /health: OK"; break; fi
                echo "  ⏳ Health check ${i}/5 (HTTP ${HTTP_CODE})..."; sleep 3
              done
            else
              echo "Service not running — skipping restart"
            fi
