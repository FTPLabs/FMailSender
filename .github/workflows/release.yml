name: "FMailSender Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 6.3.0)"
        required: true
        default: "6.3.0"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PYINSTALLER_VERSION: "6.6.0"

jobs:
  build:
    name: "Build & Release"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:

      - name: "Repo PUBLIC - build window open"
        shell: bash
        run: |
          RESULT=$(curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/FTPLabs/FMailSender" \
            -d '{"private":false}')
          echo "Visibility: $(echo $RESULT | grep -o '"visibility":"[^"]*"' || echo "$RESULT" | head -c 200)"

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Rust stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: "Rust cache"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: "Resolve version"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"    >> $GITHUB_OUTPUT
          echo "name=FMailSender v${VERSION}" >> $GITHUB_OUTPUT
          echo "Build: FMailSender v${VERSION}"

      - name: "Sync version"
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"

          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          Write-Host "tauri.conf.json => $ver"

          $cargo = Get-Content "src-tauri/Cargo.toml"
          $patched = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $patched -and $_ -match '^version\s*=\s*"') {
              $patched = $true
              "version = `"$ver`""
            } else { $_ }
          }
          $cargo | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          Write-Host "Cargo.toml => $ver"

          Set-Content "core/_version.py"   -Encoding UTF8 "APP_VERSION = `"$ver`""
          Set-Content "ui/src/version.ts"  -Encoding UTF8 "export const FRONTEND_VERSION = `"$ver`""
          Write-Host "Version synced to $ver"

      - name: "Python deps"
        shell: pwsh
        run: |
          pip install -r requirements.txt "pyinstaller==${{ env.PYINSTALLER_VERSION }}" --quiet

      - name: "Python import check"
        shell: pwsh
        run: |
          $checks = @(
            "import core._ensure_imports",
            "from core.server import app",
            "from core.sender import SendingEngine, test_smtp_connection",
            "from core.models import SmtpAccount, Recipient, CampaignConfig, CampaignStatus",
            "from core.storage import save_accounts, load_accounts",
            "from core._version import APP_VERSION",
            "import multipart"
          )
          $failed = $false
          foreach ($c in $checks) {
            $out = python -c $c 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Error "FAIL ($LASTEXITCODE): $c  ->  $out"
              $failed = $true
            } else {
              Write-Host "OK  $c"
            }
          }
          if ($failed) { exit 1 }

      - name: "PyInstaller - fmail-core.exe"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          pyinstaller fmail-core.spec `
            --distpath "src-tauri/binaries" `
            --workpath "C:/tmp/pyinstaller-build" `
            --noconfirm

          $exe = "src-tauri/binaries/fmail-core.exe"
          if (-not (Test-Path $exe)) { Write-Error "fmail-core.exe missing"; exit 1 }
          $sz = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($sz -lt 5) { Write-Error "fmail-core.exe too small ($sz MB)"; exit 1 }

          Copy-Item $exe "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "fmail-core.exe = $sz MB OK"

      - name: "UI npm install"
        working-directory: ui
        run: npm install

      - name: "UI Vite build"
        working-directory: ui
        run: npm run build

      - name: "UI verify"
        shell: pwsh
        run: |
          if (-not (Test-Path "ui/dist/index.html")) { Write-Error "ui/dist/index.html missing"; exit 1 }
          Write-Host "ui/dist OK"

      - name: "Tauri CLI"
        run: npm install -g @tauri-apps/cli@^2

      - name: "Tauri icons"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $logo = "assets/images/fmail_logo.png"
          if (Test-Path $logo) { tauri icon $logo }
          else { Write-Warning "Logo not found - using existing icons" }

      - name: "Tauri build - NSIS installer"
        id: tauri_build
        shell: pwsh
        run: |
          tauri build --target x86_64-pc-windows-msvc --verbose 2>&1

          $nsis = Get-ChildItem -Recurse "src-tauri/target" -ErrorAction SilentlyContinue |
            Where-Object { ($_.Name -like "*setup*.exe" -or $_.Name -like "*Setup*.exe") -and $_.Length -gt 5MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $nsis) {
            $nsis = Get-ChildItem -Recurse "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" `
              -Filter "*.exe" -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }

          $sz = [math]::Round($nsis.Length / 1MB, 1)
          Write-Host "NSIS installer: $($nsis.FullName) ($sz MB)"
          "installer_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          "installer_size=$sz"                >> $env:GITHUB_OUTPUT

          $appExe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" `
            -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 1MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if ($appExe) {
            "app_exe_path=$($appExe.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: "MANDATORY - Validate installer"
        shell: pwsh
        run: |
          $installer = "${{ steps.tauri_build.outputs.installer_path }}"
          if (-not (Test-Path $installer)) {
            Write-Error "VALIDATION FAILED: installer not found at $installer"
            exit 1
          }
          $sz = (Get-Item $installer).Length
          if ($sz -lt 5MB) {
            Write-Error "VALIDATION FAILED: installer too small ($([math]::Round($sz/1MB,2)) MB)"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($installer)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "VALIDATION FAILED: not a valid Windows PE (no MZ header)"
            exit 1
          }
          $sidecar = "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            Write-Error "VALIDATION FAILED: sidecar missing"
            exit 1
          }
          if ((Get-Item $sidecar).Length -lt 5MB) {
            Write-Error "VALIDATION FAILED: sidecar too small"
            exit 1
          }
          Write-Host "VALIDATION PASSED: PE ok, $([math]::Round($sz/1MB,1)) MB"

      - name: "Install NSIS (makensis for portable build)"
        shell: pwsh
        run: |
          choco install nsis --no-progress -y | Out-Null
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsis) { Write-Host "NSIS installed: $nsis" }
          else { Write-Error "makensis not found after install"; exit 1 }

      - name: "Build portable single EXE"
        id: portable
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"

          # Prepare dist_portable for makensis (matches portable.nsi File directives)
          New-Item -ItemType Directory -Force -Path "dist_portable" | Out-Null

          # 1. Copy Tauri app exe (the real app, not the NSIS installer)
          $appExe = "${{ steps.tauri_build.outputs.app_exe_path }}"
          if ($appExe -and (Test-Path $appExe)) {
            Copy-Item $appExe "dist_portable\FMailSender.exe" -Force
            Write-Host "App exe: $appExe"
          } else {
            # Fallback: find the main exe in the Tauri release dir
            $found = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" `
              -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 500KB } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName "dist_portable\FMailSender.exe" -Force
              Write-Host "Fallback app exe: $($found.FullName)"
            } else {
              Write-Error "FMailSender.exe not found in Tauri release dir"; exit 1
            }
          }

          # 2. Copy Python core sidecar
          Copy-Item "src-tauri\binaries\fmail-core-x86_64-pc-windows-msvc.exe" `
                    "dist_portable\fmail-core.exe" -Force
          Write-Host "Core sidecar copied"

          # 3. Verify both files are present and non-trivial
          $appSz  = [math]::Round((Get-Item "dist_portable\FMailSender.exe").Length  / 1MB, 1)
          $coreSz = [math]::Round((Get-Item "dist_portable\fmail-core.exe").Length   / 1MB, 1)
          Write-Host "dist_portable: FMailSender.exe=${appSz}MB  fmail-core.exe=${coreSz}MB"
          if ($appSz -lt 1)  { Write-Error "FMailSender.exe suspiciously small";  exit 1 }
          if ($coreSz -lt 5) { Write-Error "fmail-core.exe suspiciously small";   exit 1 }

          # 4. Run makensis — produces FMailSender.exe (portable.nsi OutFile)
          & "C:\Program Files (x86)\NSIS\makensis.exe" portable.nsi
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis failed (exit $LASTEXITCODE)"; exit 1 }

          # portable.nsi outputs "FMailSender.exe" (updated OutFile)
          $name = "FMailSender-v${ver}.exe"
          if     (Test-Path "FMailSender.exe") { Rename-Item "FMailSender.exe" $name -Force }
          elseif (Test-Path "MailSender.exe")  { Rename-Item "MailSender.exe"  $name -Force }
          if (-not (Test-Path $name)) { Write-Error "Portable EXE missing after makensis"; exit 1 }

          $sz  = [math]::Round((Get-Item $name).Length / 1MB, 1)
          $mz  = [System.IO.File]::ReadAllBytes($name)[0..1]
          if ($mz[0] -ne 0x4D -or $mz[1] -ne 0x5A) {
            Write-Error "Portable EXE has no MZ header — invalid PE"; exit 1
          }
          Write-Host "Portable single EXE: $name ($sz MB) — MZ OK"
          "name=$name" >> $env:GITHUB_OUTPUT
          "size=$sz"   >> $env:GITHUB_OUTPUT

      - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: false
          generate_release_notes: false
          files: |
            ${{ steps.portable.outputs.name }}
          body: |
            ## ${{ steps.tag.outputs.name }}

            ### ⬇️ Скачать

            | Файл | Размер | Описание |
            |------|--------|----------|
            | `${{ steps.portable.outputs.name }}` | ${{ steps.portable.outputs.size }} MB | **Единый portable EXE — скачать и запустить, установка не нужна** |

            ### Запуск
            1. Скачайте `${{ steps.portable.outputs.name }}`
            2. Запустите — **установка не требуется**
            3. Приложение автоматически запустится (распаковка в TEMP происходит мгновенно, незаметно)
            4. При закрытии — файлы из TEMP удаляются автоматически

            **Требования:** Windows 10 x64 (build 1803+) или Windows 11 + WebView2 Runtime
            > WebView2 входит в состав Windows 11 и обновлений Windows 10 начиная с 2021 года.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Repo PRIVATE - build window closed"
        if: always()
        shell: bash
        run: |
          RESULT=$(curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/FTPLabs/FMailSender" \
            -d '{"private":true}')
          echo "Visibility: $(echo $RESULT | grep -o '"visibility":"[^"]*"' || echo "$RESULT" | head -c 200)"
