name: "Build & Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 6.0.2)"
        required: true
        default: "6.0.2"
      prerelease:
        description: "Pre-release?"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  build:
    name: "Build Windows Portable EXE"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Setup Rust stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: "Cache Rust"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: "Install Python deps"
        run: pip install -r requirements.txt pyinstaller

      - name: "Verify Python imports"
        shell: pwsh
        run: |
          python -c "from core.proxy import ProxyManager, parse_proxy, validate_proxy; print('proxy OK')"
          python -c "from core.server import app; print('server OK')"
          python -c "from core.storage import save_accounts, load_accounts; print('storage OK')"
          python -c "from core.sender import SendingEngine, test_smtp_connection; print('sender OK')"
          python -c "from core.models import SmtpAccount, Recipient, CampaignConfig, CampaignStatus; print('models OK')"

      - name: "Build Python core (PyInstaller)"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          pyinstaller fmail-core.spec `
            --distpath "src-tauri/binaries" `
            --workpath "C:/tmp/pyinstaller-build" `
            --noconfirm
          $exe = "src-tauri/binaries/fmail-core.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "fmail-core.exe not found after PyInstaller!"
            exit 1
          }
          Write-Host "fmail-core.exe: $([math]::Round((Get-Item $exe).Length/1MB,1)) MB"
          Copy-Item $exe "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe" -Force

      - name: "Install UI deps"
        working-directory: ui
        run: npm install

      - name: "Build React UI"
        working-directory: ui
        run: npm run build

      - name: "Install tauri CLI globally"
        run: npm install -g @tauri-apps/cli@^2

      - name: "Generate Tauri icons"
        shell: pwsh
        run: |
          $logo = "assets/images/fmail_logo.png"
          if (Test-Path $logo) {
            tauri icon $logo
            Write-Host "Icons generated from $logo"
          } else {
            Write-Host "No custom logo found, using default icons"
          }

      - name: "Build Tauri portable EXE"
        shell: pwsh
        run: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: "Find built artifact"
        id: artifact
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          Write-Host "Listing bundle dir:"
          if (Test-Path $bundle) {
            Get-ChildItem $bundle -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Error "Bundle dir not found: $bundle"
            exit 1
          }
          $exe = Get-ChildItem -Path $bundle -Filter "*_portable.exe" -Recurse -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $bundle -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          }
          if (-not $exe) {
            Write-Error "No .exe found in $bundle"
            exit 1
          }
          Write-Host "Artifact: $($exe.FullName)"
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)"     >> $env:GITHUB_OUTPUT

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: FMailSender-v${{ github.event.inputs.version || github.ref_name }}-portable
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: "Determine release tag"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "name=FMailSender v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}"   >> $GITHUB_OUTPUT
            echo "name=FMailSender ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: "Create GitHub Release"
        if: >
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
          body: |
            ## ${{ steps.tag.outputs.name }}

            **Portable EXE** — не требует установки. Просто запустите .exe файл.
            Python не нужен — всё встроено.

            ### Требования
            - Windows 10 x64 (build 1803+) или Windows 11
            - WebView2 Runtime (предустановлен на Win11; на Win10 скачается автоматически)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
