name: "FMailSender Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 6.8.1)"
        required: true
        default: "6.8.2"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PYINSTALLER_VERSION: "6.6.0"

jobs:
  build:
    name: "Build & Release"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 120

    steps:

      - name: "Repo PUBLIC — build window open"
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "${PAT_TOKEN}" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${PAT_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/FTPLabs/FMailSender" \
              -d '{"private":false}' | grep -o '"private":[a-z]*' || true
            echo "Repo: PUBLIC"
          else
            echo "PAT_TOKEN not set — assuming repo is already public"
          fi

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Rust stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: "Rust cache"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: "Resolve version"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"    >> $GITHUB_OUTPUT
          echo "name=FMailSender v${VERSION}" >> $GITHUB_OUTPUT
          echo "Build: FMailSender v${VERSION}"

      - name: "Sync version"
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"

          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          Write-Host "tauri.conf.json => $ver"

          $cargo = Get-Content "src-tauri/Cargo.toml"
          $patched = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $patched -and $_ -match 'version\s*=\s*"') {
              $patched = $true
              "version = `"$ver`""
            } else { $_ }
          }
          $cargo | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          Write-Host "Cargo.toml => $ver"

          Set-Content "core/_version.py"   -Encoding UTF8 "APP_VERSION = `"$ver`""
          Set-Content "ui/src/version.ts"  -Encoding UTF8 "export const FRONTEND_VERSION = `"$ver`""
          Write-Host "Version synced to $ver"

      - name: "Python deps"
        shell: pwsh
        run: |
          pip install -r requirements.txt "pyinstaller==${{ env.PYINSTALLER_VERSION }}" --quiet

      - name: "Python import check"
        shell: pwsh
        run: |
          $checks = @(
            "import core._ensure_imports",
            "from core.server import app",
            "from core.sender import SendingEngine, test_smtp_connection",
            "from core.models import SmtpAccount, Recipient, CampaignConfig, CampaignStatus",
            "from core.storage import save_accounts, load_accounts",
            "from core.license import get_license_status, activate_license_key",
            "from core._version import APP_VERSION",
            "import multipart",
            "import requests"
          )
          $failed = @()
          foreach ($chk in $checks) {
            try {
              python -c $chk 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { $failed += $chk }
              else { Write-Host "OK: $chk" }
            } catch { $failed += $chk }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Import checks failed:`n$($failed -join "`n")"
            exit 1
          }
          Write-Host "All import checks passed."

      - name: "PyInstaller - fmail-core.exe"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          pyinstaller fmail-core.spec `
            --distpath "src-tauri/binaries" `
            --workpath "C:/tmp/pyinstaller-build" `
            --noconfirm

          $exe = "src-tauri/binaries/fmail-core.exe"
          if (-not (Test-Path $exe)) { Write-Error "fmail-core.exe missing"; exit 1 }
          $sz = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($sz -lt 5) { Write-Error "fmail-core.exe too small ($sz MB)"; exit 1 }

          Copy-Item $exe "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "fmail-core.exe = $sz MB OK"

      - name: "UI npm install"
        working-directory: ui
        run: npm install

      - name: "UI Vite build"
        working-directory: ui
        run: npm run build

      - name: "UI verify"
        shell: pwsh
        run: |
          if (-not (Test-Path "ui/dist/index.html")) { Write-Error "ui/dist/index.html missing"; exit 1 }
          Write-Host "ui/dist OK"

      - name: "Tauri CLI"
        run: npm install -g @tauri-apps/cli@^2

      - name: "Tauri icons"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $logo = "assets/images/fmail_logo.png"
          if (Test-Path $logo) { tauri icon $logo }
          else { Write-Warning "Logo not found - using existing icons" }

      - name: "Tauri build"
        id: tauri_build
        shell: pwsh
        run: |
          tauri build --target x86_64-pc-windows-msvc --verbose 2>&1

          $target = "x86_64-pc-windows-msvc"

          # Locate the compiled app exe (raw binary, NOT the NSIS installer)
          $appExe = Get-ChildItem "src-tauri/target/$target/release" `
            -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 1MB } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $appExe) {
            Write-Error "App exe not found in src-tauri/target/$target/release"
            exit 1
          }

          $sz = [math]::Round($appExe.Length / 1MB, 1)
          Write-Host "App exe: $($appExe.FullName) ($sz MB)"
          "app_exe_path=$($appExe.FullName)" >> $env:GITHUB_OUTPUT
          "app_exe_size=$sz"                  >> $env:GITHUB_OUTPUT

      - name: "Verify core embedded in exe"
        shell: pwsh
        run: |
          # ─── Core Embedding Verification ─────────────────────────────────────────
          # Proves that include_bytes!("../binaries/fmail-core-x86_64-pc-windows-msvc.exe")
          # actually embedded the Python core into the Tauri executable.
          # ──────────────────────────────────────────────────────────────────────────
          $target   = "x86_64-pc-windows-msvc"
          $coreFile = "src-tauri/binaries/fmail-core-x86_64-pc-windows-msvc.exe"

          if (-not (Test-Path $coreFile)) {
            Write-Error "Core binary missing: $coreFile"; exit 1
          }
          $coreSzMB  = [math]::Round((Get-Item $coreFile).Length / 1MB, 1)

          $appExePath = "${{ steps.tauri_build.outputs.app_exe_path }}"
          if (-not $appExePath -or -not (Test-Path $appExePath)) {
            $appExePath = (Get-ChildItem "src-tauri/target/$target/release" -Filter "*.exe" `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 1MB } |
              Sort-Object Length -Descending | Select-Object -First 1).FullName
          }
          if (-not $appExePath) { Write-Error "App exe not found for verification"; exit 1 }

          $appSzMB   = [math]::Round((Get-Item $appExePath).Length / 1MB, 1)
          $minSzMB   = [math]::Round($coreSzMB + 3, 0)

          Write-Host ""
          Write-Host "════════════════ CORE EMBEDDING VERIFICATION ════════════════"
          Write-Host "  Source core:    $coreFile  ($coreSzMB MB)"
          Write-Host "  App exe:        $appExePath  ($appSzMB MB)"
          Write-Host "  Required min:   $minSzMB MB"
          Write-Host ""

          if ($appSzMB -lt $minSzMB) {
            Write-Error "FAIL [SIZE]: App exe is $appSzMB MB but minimum expected is $minSzMB MB."
            Write-Error "include_bytes!() did NOT embed the core. Run PyInstaller BEFORE tauri build."
            exit 1
          }
          Write-Host "  [PASS] Size:    $appSzMB MB >= $minSzMB MB"

          $bytes   = [System.IO.File]::ReadAllBytes($appExePath)
          $text    = [System.Text.Encoding]::Latin1.GetString($bytes)
          $markers = @("MEI", "PyInstaller", "_MEIPASS", "python3", "fmail")
          $hit     = $false
          foreach ($m in $markers) {
            if ($text.Contains($m)) {
              Write-Host "  [PASS] Marker:  '$m' found — PyInstaller bundle is present"
              $hit = $true; break
            }
          }
          if (-not $hit) {
            Write-Warning "  [WARN] No PyInstaller markers found — size check passed so core likely present."
          }
          $bytes = $null; $text = $null

          $coreSzBytes = (Get-Item $coreFile).Length
          if ($coreSzBytes -lt 5MB) {
            Write-Error "FAIL [INTEGRITY]: Core binary only $([math]::Round($coreSzBytes/1KB))KB — corrupted"; exit 1
          }
          Write-Host "  [PASS] Integrity: core file intact ($coreSzMB MB)"
          Write-Host ""
          Write-Host "  ✅  VERIFICATION PASSED — fmail-core IS embedded in FMailSender.exe"
          Write-Host "════════════════════════════════════════════════════════════════"

      # ── FIX v6.9: Ship raw Tauri exe directly — no NSIS wrapper ──────────────
      # Previously: NSIS launcher extracted FMailSender.exe to %LOCALAPPDATA% and
      # created a desktop shortcut — violating the "downloaded file IS the final app"
      # requirement.
      #
      # Now: the raw fmail-sender.exe (output of tauri build) is renamed and shipped
      # directly. It already contains fmail-core embedded via include_bytes!().
      # At runtime it extracts core to %LOCALAPPDATA%\FMailSender\core\ (system-level,
      # no user-visible desktop files) and starts Python server + WebView2 window.
      # ─────────────────────────────────────────────────────────────────────────────
      - name: "Package portable EXE (direct, no installer)"
        id: portable
        shell: pwsh
        run: |
          $ver        = "${{ steps.tag.outputs.version }}"
          $appExePath = "${{ steps.tauri_build.outputs.app_exe_path }}"
          $outName    = "FMailSender.exe"

          if (-not $appExePath -or -not (Test-Path $appExePath)) {
            $target = "x86_64-pc-windows-msvc"
            $found = Get-ChildItem "src-tauri/target/$target/release" -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notlike "fmail-core*" -and $_.Length -gt 1MB } |
              Sort-Object Length -Descending | Select-Object -First 1
            if (-not $found) { Write-Error "App exe not found"; exit 1 }
            $appExePath = $found.FullName
          }

          $sz = [math]::Round((Get-Item $appExePath).Length / 1MB, 1)
          if ($sz -lt 15) {
            Write-Error "App exe too small ($sz MB) — Python core may not be embedded."
            Write-Error "Ensure PyInstaller ran before tauri build."
            exit 1
          }

          Copy-Item $appExePath $outName -Force
          Write-Host "Portable EXE: $outName ($sz MB)"
          "name=$outName"   >> $env:GITHUB_OUTPUT
          "size=$sz"        >> $env:GITHUB_OUTPUT

      - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: false
          generate_release_notes: false
          files: |
            ${{ steps.portable.outputs.name }}
          body: |
            ## ${{ steps.tag.outputs.name }}

            | Файл | Размер | Описание |
            |------|--------|----------|
            | `${{ steps.portable.outputs.name }}` | ${{ steps.portable.outputs.size }} МБ | **Portable EXE — скачай и запусти, установщик не нужен** |

            ### Запуск
            1. Скачайте `${{ steps.portable.outputs.name }}`
            2. Запустите — приложение стартует автоматически (ядро встроено)
            3. При первом запуске введите лицензионный ключ

            ### Что происходит при запуске
            - Первый запуск: Defender может сканировать файл (~10-30 сек) — это нормально
            - Python-ядро автоматически извлекается в системную папку `%LOCALAPPDATA%\FMailSender\core\`
            - Все вычисления выполняются на мощностях вашего компьютера
            - Единственный сетевой запрос при старте — проверка лицензии на fmail.shop

            **Требования:** Windows 10 x64 (build 1803+) или Windows 11.
            WebView2 Runtime устанавливается автоматически если не установлен.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Repo PRIVATE — build window closed"
        if: always()
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "${PAT_TOKEN}" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${PAT_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/FTPLabs/FMailSender" \
              -d '{"private":true}' | grep -o '"private":[a-z]*' || true
            echo "Repo: PRIVATE"
          else
            echo "PAT_TOKEN not set — repo remains public. Set PAT_TOKEN secret for auto-close."
          fi
