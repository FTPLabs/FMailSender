name: "FMailSender Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 7.0.3)"
        required: true
        default: "7.0.3"

env:
  PYTHON_VERSION:      "3.12"
  PYINSTALLER_VERSION: "6.21.0"
  NODE_VERSION:        "22"

jobs:
  build:
    name: "Build & Release"
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:

      - name: "Repo PUBLIC — build window open"
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "${PAT_TOKEN}" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${PAT_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/FTPLabs/FMailSender" \
              -d '{"private":false}' | grep -o '"private":[a-z]*' || true
            echo "Repo: PUBLIC"
          else
            echo "PAT_TOKEN not set — assuming repo is already public"
          fi

      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: "Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Rust stable (x86_64-pc-windows-msvc)"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: "Rust cache"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Версия

      - name: "Resolve version"
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}"    >> $GITHUB_OUTPUT
          echo "name=FMailSender v${VERSION}" >> $GITHUB_OUTPUT
          echo "Build: FMailSender v${VERSION}"

      - name: "Sync version across all files"
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          $cargo = Get-Content "src-tauri/Cargo.toml"
          $patched = $false
          $cargo = $cargo | ForEach-Object {
            if (-not $patched -and $_ -match 'version\s*=\s*"') {
              $patched = $true; "version = `"$ver`""
            } else { $_ }
          }
          $cargo | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          Set-Content "core/_version.py"  -Encoding UTF8 "APP_VERSION = `"$ver`""
          Set-Content "ui/src/version.ts" -Encoding UTF8 "export const FRONTEND_VERSION = `"$ver`""
          Write-Host "Version synced: $ver"

      # Python deps

      - name: "Install Python runtime deps"
        shell: pwsh
        run: |
          pip install --upgrade pip wheel --quiet
          pip install -r requirements.txt --quiet
          Write-Host "Python deps installed."

      - name: "Install PyInstaller ${{ env.PYINSTALLER_VERSION }}"
        shell: pwsh
        run: |
          pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}" `
                      "pyinstaller-hooks-contrib>=2024.11" `
                      --quiet
          Write-Host "PyInstaller ${{ env.PYINSTALLER_VERSION }} ready."

      # BUILD STEP 1: Python core → onedir папка (НЕ onefile!)
      # КЛЮЧЕВОЕ ИЗМЕНЕНИЕ v7.0.3:
      #   onefile  = при каждом старте распаковывает Python в temp → AV блокирует.
      #   onedir   = распаковывает ОДИН РАЗ при первом запуске, затем запускается напрямую.

      - name: "Build fmail-core (PyInstaller onedir)"
        shell: pwsh
        run: |
          Write-Host "=== PyInstaller onedir build ===" -ForegroundColor Cyan
          $start = Get-Date
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          pyinstaller fmail-core.spec `
            --noconfirm `
            --distpath dist `
            --workpath build_workdir `
            --clean
          $elapsed = [math]::Round(((Get-Date) - $start).TotalSeconds)
          Write-Host "PyInstaller done in ${elapsed}s" -ForegroundColor Green

          # onedir выводит dist/fmail-core/ (папка), НЕ dist/fmail-core.exe
          if (-not (Test-Path "dist/fmail-core/fmail-core.exe")) {
            Write-Error "FAIL: dist/fmail-core/fmail-core.exe not found"
            Write-Host "Contents of dist/:"
            Get-ChildItem dist/ -ErrorAction SilentlyContinue | Format-Table
            exit 1
          }

          $dirSize = [math]::Round(
            (Get-ChildItem "dist/fmail-core" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB,
            1
          )
          Write-Host "dist/fmail-core/ total: ${dirSize} MB" -ForegroundColor Green
          if ($dirSize -lt 20) {
            Write-Error "onedir слишком маленький (${dirSize} MB) — проверьте hiddenimports"
            exit 1
          }

      # Верификация ядра (тест импортов в onedir режиме)

      - name: "Verify core binary — import test"
        shell: pwsh
        run: |
          Write-Host "Testing core binary (--test mode)..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath "dist/fmail-core/fmail-core.exe" `
                                -ArgumentList "--test" `
                                -PassThru -Wait -WindowStyle Hidden `
                                -RedirectStandardOutput "core_test_out.txt" `
                                -RedirectStandardError  "core_test_err.txt"
          $exitCode = $proc.ExitCode
          if ($exitCode -eq 0) {
            Write-Host "Core OK (exit 0) — все импорты прошли" -ForegroundColor Green
          } elseif ($exitCode -eq 2) {
            Write-Host "Core OK (exit 2) — бинарь запускается нормально" -ForegroundColor Green
          } else {
            $out = Get-Content "core_test_out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15
            $err = Get-Content "core_test_err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15
            Write-Host "STDOUT: $out"
            Write-Error "Core FAILED (exit $exitCode): $err"
            exit 1
          }

      # BUILD STEP 2: Упаковка onedir в ZIP для Tauri include_bytes!
      # ZIP содержит папку fmail-core/ → после распаковки в LOCALAPPDATA\FMailSender\:
      #   LOCALAPPDATA\FMailSender\fmail-core\fmail-core.exe  ← запускаем это
      #   LOCALAPPDATA\FMailSender\fmail-core\_internal\      ← DLLs, .pyd

      - name: "Pack onedir → fmail-core.zip (sidecar for Tauri)"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null

          Compress-Archive `
            -Path            "dist/fmail-core" `
            -DestinationPath "src-tauri/binaries/fmail-core.zip" `
            -Force

          $zipSz = [math]::Round((Get-Item "src-tauri/binaries/fmail-core.zip").Length / 1MB, 1)
          Write-Host "fmail-core.zip: ${zipSz} MB" -ForegroundColor Green

          if ($zipSz -lt 15) {
            Write-Error "ZIP слишком маленький (${zipSz} MB)"
            exit 1
          }

      # BUILD STEP 3: React / Vite

      - name: "Install UI deps"
        shell: pwsh
        working-directory: ui
        run: |
          npm install
          Write-Host "UI deps installed."

      - name: "Build UI (Vite)"
        shell: pwsh
        working-directory: ui
        run: |
          npm run build
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "UI build failed: dist/index.html not found"
            exit 1
          }
          Write-Host "UI build OK."

      # BUILD STEP 4: Tauri (raw EXE, без NSIS installer)
      # main.rs: include_bytes!("../binaries/fmail-core.zip") встраивает ZIP внутрь EXE.
      # При первом запуске Tauri распаковывает ZIP → LOCALAPPDATA\FMailSender\.
      # Последующие запуски: хеш совпадает → пропускает распаковку → мгновенный старт.

      - name: "Install tauri-cli"
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked --quiet 2>&1 | `
            Select-String -Pattern "Installed|Compiling|warning" | Select-Object -Last 5
          Write-Host "tauri-cli ready."

      - name: "Build Tauri (portable EXE — без installer, onedir ZIP встроен)"
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Write-Host "=== Tauri build ===" -ForegroundColor Cyan
          cargo tauri build --target x86_64-pc-windows-msvc
          Write-Host "=== Tauri build done ===" -ForegroundColor Green

      # BUILD STEP 5: Финальный portable EXE

      - name: "Package portable EXE (NO installer)"
        id: portable
        shell: pwsh
        run: |
          $ver      = "${{ steps.tag.outputs.version }}"
          $finalName = "FMailSender_v${ver}.exe"
          $rawExe   = "src-tauri/target/x86_64-pc-windows-msvc/release/fmail-sender.exe"

          if (-not (Test-Path $rawExe)) {
            Write-Error "CRITICAL: fmail-sender.exe не найден: $rawExe"
            exit 1
          }

          $sizeMb = [math]::Round((Get-Item $rawExe).Length / 1MB, 1)
          if ($sizeMb -lt 20) {
            Write-Error "EXE слишком маленький (${sizeMb} MB) — fmail-core.zip не встроен."
            exit 1
          }

          Copy-Item $rawExe $finalName -Force
          Write-Host "Portable EXE: $finalName (${sizeMb} MB)" -ForegroundColor Green
          echo "name=$finalName" >> $env:GITHUB_OUTPUT
          echo "size=$sizeMb"    >> $env:GITHUB_OUTPUT

      # Финальная верификация

      - name: "Verify final artifacts"
        shell: pwsh
        run: |
          $errors  = @()
          $exeName = "${{ steps.portable.outputs.name }}"

          if (Test-Path $exeName) {
            $sz = [math]::Round((Get-Item $exeName).Length / 1MB, 1)
            Write-Host "[OK] $exeName ($sz MB)" -ForegroundColor Green
            if ($sz -lt 20) { $errors += "EXE слишком маленький (${sz} MB)" }
          } else { $errors += "EXE не найден: $exeName" }

          if (Test-Path "src-tauri/binaries/fmail-core.zip") {
            $zsz = [math]::Round((Get-Item "src-tauri/binaries/fmail-core.zip").Length / 1MB, 1)
            Write-Host "[OK] fmail-core.zip (${zsz} MB)" -ForegroundColor Green
          } else { $errors += "fmail-core.zip НЕ НАЙДЕН" }

          if (Test-Path "ui/dist/index.html") {
            Write-Host "[OK] ui/dist/index.html present" -ForegroundColor Green
          } else { $errors += "UI dist/index.html НЕ НАЙДЕН" }

          if (Test-Path "dist/fmail-core/fmail-core.exe") {
            Write-Host "[OK] dist/fmail-core/fmail-core.exe present" -ForegroundColor Green
          } else { $errors += "dist/fmail-core/fmail-core.exe НЕ НАЙДЕН" }

          if ($errors.Count -eq 0) {
            Write-Host "=== ALL CHECKS PASSED ===" -ForegroundColor Green
          } else {
            $errors | ForEach-Object { Write-Host "[FAIL] $_" -ForegroundColor Red }
            Write-Error "Verification failed!"
            exit 1
          }

      # GitHub Release

      - name: "GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.tag.outputs.tag }}
          name:       "${{ steps.tag.outputs.name }}"
          draft:      false
          prerelease: false
          generate_release_notes: false
          body: |
            ## ${{ steps.tag.outputs.name }}

            ### Установка (без установщика)
            1. Скачайте **FMailSender_v${{ steps.tag.outputs.version }}.exe**
            2. Запустите — приложение откроется
            3. **Первый запуск**: Python-ядро устанавливается в `%LOCALAPPDATA%\FMailSender\` (~30 сек, только один раз)
            4. **Последующие запуски**: мгновенный старт

            ### Архитектура v7.0.3 (onedir — без AV-проблем)
            - Tauri v2 shell + React UI
            - Python FastAPI ядро (PyInstaller **onedir**) встроено как ZIP
            - При первом запуске: ZIP распаковывается в LOCALAPPDATA один раз
            - При повторных запусках: файлы уже на месте, никакой динамической распаковки
            - AV не может блокировать: запуск из стабильной папки LOCALAPPDATA

            ### Требования
            - Windows 10/11 x64
            - WebView2 Runtime (предустановлен в Windows 11)

          files: ${{ steps.portable.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: "Deploy to VPS (fmail.shop)"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: read
    steps:
      - name: "SSH deploy to VPS"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port:     22
          timeout:  120s
          script: |
            set -e
            cd /opt/fmailsender
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            echo "Code updated: $(git log --oneline -1)"
            if systemctl is-active --quiet fmailsender; then
              systemctl restart fmailsender
              sleep 3
              systemctl is-active --quiet fmailsender && echo "Service: ACTIVE" || echo "Service: restarted"
            else
              echo "Service not running — skipping restart"
            fi
