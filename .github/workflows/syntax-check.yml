name: Python Syntax Check

  on:
    push:
      branches: [main]
      paths: ['**.py']
    pull_request:
      branches: [main]
      paths: ['**.py']

  jobs:
    syntax-check:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: py_compile — проверка всех .py файлов
          run: |
            echo "=== Syntax check: py_compile ==="
            FAILED=0
            find . -name "*.py" \
              -not -path "./.git/*" \
              -not -path "./.venv/*" \
              -not -path "./venv/*" \
              -not -path "./__pycache__/*" | sort | while read f; do
              if ! python -m py_compile "$f" 2>/tmp/err_out; then
                echo "FAIL: $f"
                cat /tmp/err_out
                echo "FAILED=1" >> /tmp/syntax_result
              else
                echo "OK: $f"
              fi
            done
            if [ -f /tmp/syntax_result ]; then
              echo ""
              echo "=== SYNTAX ERRORS FOUND ==="
              exit 1
            fi
            echo "All .py files passed syntax check."

        - name: pyflakes — проверка неиспользуемых импортов и undefined names
          run: |
            pip install pyflakes --quiet
            python -m pyflakes . 2>&1 | grep -v "__pycache__" | grep -v ".venv" || true
            echo "pyflakes check complete"
  