name: Post-Deploy Bot Checker

on:
  workflow_run:
    workflows: ["Auto Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      server_host:
        description: 'Server IP or hostname'
        required: false
        default: '31.76.100.190'

jobs:
  check-bot-syntax:
    name: Check bot.py syntax and handlers
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax of all server files
        run: |
          echo "=== Syntax check ==="
          FAILED=0
          for f in server/bot.py server/database.py server/config.py server/crypto_pay.py server/xrocket_pay.py server/lzt_pay.py server/payment_providers.py; do
            python3 -m py_compile "$f" && echo "✅ $f" || { echo "❌ $f SYNTAX ERROR"; FAILED=1; }
          done
          [ $FAILED -eq 1 ] && exit 1 || echo "All files OK"

      - name: Run bot handler checker
        run: |
          echo "=== Handler registration check ==="
          python3 scripts/bot_checker.py

      - name: Check all callback_data patterns
        run: |
          echo "=== Callback coverage ==="
          CALLBACKS=(
            "buy_plan" "check_license" "my_balance" "open_ticket" "main_menu"
            "admin_panel" "admin_stats" "admin_broadcast" "admin_licenses"
            "admin_add_lic" "admin_revoke_lic" "admin_promos" "admin_promo_create"
            "admin_promo_deactivate" "admin_balance" "admin_mods" "admin_tickets"
            "promo_yes" "promo_no" "sub_check" "cancel_ticket"
            "pay_balance:" "check_pay:" "pay_crypto:" "pay_xrocket:"
            "admin_ticket:" "admin_reply:" "admin_remove_mod:" "admin_set_price"
          )
          FAILED=0
          for cb in "${CALLBACKS[@]}"; do
            grep -q "$cb" server/bot.py && echo "✅ $cb" || { echo "❌ MISSING: $cb"; FAILED=1; }
          done
          [ $FAILED -eq 1 ] && exit 1 || echo "All callbacks registered"

      - name: Check for dangerous patterns
        run: |
          echo "=== Security patterns ==="
          # Проверяем что admin panel защищена
          grep -q "is_admin" server/bot.py && echo "✅ is_admin() check present" || { echo "❌ CRITICAL: is_admin() not found!"; exit 1; }
          # Проверяем что нет хардкодных токенов
          ! grep -E 'BOT_TOKEN\s*=\s*"[0-9]' server/bot.py && echo "✅ No hardcoded BOT_TOKEN" || echo "⚠️ Possible hardcoded token"
          echo "Security checks passed"

  check-live-api:
    name: Check live API endpoints
    runs-on: ubuntu-latest
    needs: check-bot-syntax
    
    steps:
      - name: Test API endpoints
        run: |
          BASE="https://fmail.shop"
          FAILED=0

          echo "=== Live API endpoint checks ==="

          # Root
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE/" || echo "000")
          [ "$STATUS" -lt 500 ] && [ "$STATUS" != "000" ] && echo "✅ / → $STATUS" || { echo "❌ / → $STATUS (UNREACHABLE or 5xx)"; FAILED=1; }

          # /v1/verify — невалидный ключ должен дать 400/404, не 500
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST "$BASE/v1/verify" \
            -H "Content-Type: application/json" \
            -d '{"key":"CHECK-0000-0000-0000","hwid":"CHECKHWID"}' || echo "000")
          [ "$STATUS" -lt 500 ] && [ "$STATUS" != "000" ] && echo "✅ /v1/verify → $STATUS" || { echo "❌ /v1/verify → $STATUS (5xx or unreachable)"; FAILED=1; }

          # /v1/activate — невалидный ключ: ожидаем не 500
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST "$BASE/v1/activate" \
            -H "Content-Type: application/json" \
            -d '{"key":"CHECK-0000-0000-0000","hwid":"CHECKHWID"}' || echo "000")
          [ "$STATUS" -lt 500 ] && [ "$STATUS" != "000" ] && echo "✅ /v1/activate → $STATUS" || { echo "❌ /v1/activate → $STATUS (5xx or unreachable)"; FAILED=1; }

          # /v1/download — должен отдавать файл или 401/403/404, не 500
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE/v1/download/FMailSender.exe?key=INVALID" || echo "000")
          [ "$STATUS" -lt 500 ] && [ "$STATUS" != "000" ] && echo "✅ /v1/download → $STATUS" || { echo "❌ /v1/download → $STATUS (5xx or unreachable)"; FAILED=1; }

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Некоторые endpoints недоступны или вернули 5xx!"
            echo "   Проверьте: journalctl -u fmailsender -n 50 --no-pager"
            exit 1
          fi
          
          echo ""
          echo "✅ Все API endpoints работают корректно"

  check-bot-logs:
    name: Check bot logs for critical errors
    runs-on: ubuntu-latest
    needs: check-bot-syntax
    if: ${{ secrets.VPS_KEY != '' }}

    steps:
      - name: SSH into server and check logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_KEY }}
          script: |
            echo "=== Статус сервиса ==="
            systemctl is-active fmailsender || { 
              echo "❌ Сервис упал!"
              journalctl -u fmailsender -n 50 --no-pager
              exit 1
            }
            echo "✅ fmailsender: active"

            echo ""
            echo "=== Последние 30 строк лога ==="
            journalctl -u fmailsender -n 30 --no-pager

            echo ""
            echo "=== Поиск критических ошибок (последние 5 минут) ==="
            CRIT=$(journalctl -u fmailsender --since "5 minutes ago" --no-pager 2>/dev/null | \
              grep -iE "cannot import|ModuleNotFoundError|SyntaxError|database is locked|Fatal error|Address already in use|Bot token invalid" | wc -l)
            
            if [ "$CRIT" -gt 0 ]; then
              echo "❌ Найдено $CRIT критических ошибок после деплоя!"
              journalctl -u fmailsender --since "5 minutes ago" --no-pager | grep -iE "cannot import|ModuleNotFoundError|SyntaxError|database is locked|Fatal"
              exit 1
            fi
            echo "✅ Критических ошибок не найдено"

            echo ""
            echo "=== Проверка БД ==="
            DB="/opt/fmailsender/server/licenses.db"
            if [ -f "$DB" ]; then
              INTEGRITY=$(sqlite3 "$DB" "PRAGMA integrity_check;" 2>&1)
              [ "$INTEGRITY" = "ok" ] && echo "✅ БД целостность: OK" || echo "❌ БД: $INTEGRITY"
            else
              echo "⚠️  licenses.db не найдена — первый запуск?"
            fi

            echo ""
            echo "✅ Post-deploy check PASSED"
