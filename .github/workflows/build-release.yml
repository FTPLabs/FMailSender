name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.8.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Get version
        id: version
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, '.')
          from core._version import APP_VERSION
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={APP_VERSION}\n')

      - name: Build EXE
        run: python build.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify EXE exists
        run: |
          $exe = 'dist\FMailSender.exe'
          if (!(Test-Path $exe)) { Write-Error 'EXE not found!'; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "✅ EXE built: $size MB"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMailSender-${{ steps.version.outputs.version }}-win64
          path: dist/FMailSender.exe
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FMail Sender ${{ steps.version.outputs.version }}"
          body: |
            ## FMail Sender ${{ steps.version.outputs.version }}

            ### Что нового в v3.8.0
            - Исправлены дублирующиеся SMTP-конфиги (web.de, yandex, zoho, yahoo)
            - OAuth2/XOAUTH2 добавлен в async-путь отправки (Outlook/Hotmail/Live)
            - Новые провайдеры: Fastmail, Tutanota/Tuta, Yahoo CA
            - Лог рассылки ограничен 1000 строк (защита от утечки RAM)
            - Производительность: scrollToBottom батчами, не на каждую строку
            - build.py: исправлен невалидный параметр collect_all
            - Версия: 3.8.0

            ### Установка
            1. Скачайте `FMailSender.exe`
            2. Запустите — установка не требуется
          files: dist/FMailSender.exe
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}