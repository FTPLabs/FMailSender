name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.2.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Get version
        id: version
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, '.')
          from core._version import APP_VERSION
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={APP_VERSION}\n')

      - name: Build EXE
        run: python build.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify EXE exists
        run: |
          $exe = 'dist\FMailSender.exe'
          if (!(Test-Path $exe)) { Write-Error 'EXE not found!'; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "EXE built: $size MB"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMailSender-${{ steps.version.outputs.version }}-win64
          path: dist/FMailSender.exe
          retention-days: 90

      - name: Create GitHub Release
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FMail Sender ${{ steps.version.outputs.version }}"
          body: |
            ## FMail Sender ${{ steps.version.outputs.version }}

            Полный список изменений — в [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            ### Установка
            1. Скачайте `FMailSender.exe`
            2. Запустите — установка не требуется
          files: dist/FMailSender.exe
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload patch manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, sys, hashlib, json
          sys.path.insert(0, '.')
          from core._version import APP_VERSION
          exe_path = 'dist/FMailSender.exe'
          with open(exe_path, 'rb') as f:
              data = f.read()
          sha256 = hashlib.sha256(data).hexdigest()
          size = len(data)
          tag = f'v{APP_VERSION}'
          base_url = f'https://github.com/FTPLabs/FMailSender/releases/download/{tag}'
          manifest = {
              'version': APP_VERSION,
              'tag': tag,
              'files': [
                  {'path': 'FMailSender.exe', 'sha256': sha256,
                   'url': f'{base_url}/FMailSender.exe', 'size': size}
              ]
          }
          out = f'dist/patch_manifest_v{APP_VERSION}.json'
          with open(out, 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f'Manifest: {out}')

      - name: Upload patch manifest to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/patch_manifest_v${{ steps.version.outputs.version }}.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy version.json to fmail.shop
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          import os, json, stat, sys
          from pathlib import Path

          try:
              import paramiko
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'paramiko', '-q'])
              import paramiko

          host = os.environ.get('VPS_HOST', '')
          user = os.environ.get('VPS_USER', '')
          password = os.environ.get('VPS_PASS', '')
          if not (host and user and password):
              print('VPS secrets not configured, skipping version.json deploy')
              sys.exit(0)

          sys.path.insert(0, '.')
          from core._version import APP_VERSION
          tag = f'v{APP_VERSION}'
          base = f'https://github.com/FTPLabs/FMailSender/releases/download/{tag}'
          exe_size = Path('dist/FMailSender.exe').stat().st_size
          import time
          ts = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          data = {
              'version': APP_VERSION,
              'tag': tag,
              'release_name': f'FMail Sender {APP_VERSION}',
              'body': 'Подробности: CHANGELOG.md',
              'html_url': f'https://github.com/FTPLabs/FMailSender/releases/tag/{tag}',
              'exe_url': f'{base}/FMailSender.exe',
              'exe_size': exe_size,
              'patch_manifest_url': f'{base}/patch_manifest_{tag}.json',
              'published_at': ts,
          }
          content = json.dumps(data, ensure_ascii=False, indent=2)

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(host, username=user, password=password, timeout=15)
          sftp = client.open_sftp()
          with sftp.open('/var/www/html/version.json', 'w') as f:
              f.write(content)
          sftp.chmod('/var/www/html/version.json', 0o644)
          sftp.close()
          client.close()
          print(f'version.json deployed for {tag}')
