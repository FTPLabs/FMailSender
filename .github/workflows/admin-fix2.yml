name: Admin DB Fix2
on:
  workflow_dispatch:
jobs:
  db-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Find and fix all DBs
        uses: appleboy/ssh-action@v1
        with:
          host: 31.76.100.190
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            apt-get install -y sqlite3 -q 2>/dev/null || true
            echo "=== Running fmailsender processes ==="
            ps aux | grep -E "python|bot|fmail" | grep -v grep
            echo "=== systemctl status ==="
            systemctl status fmailsender --no-pager 2>/dev/null || true
            echo "=== ALL licenses.db files ==="
            find / -name "licenses.db" 2>/dev/null
            echo "=== lsof licenses.db ==="
            lsof 2>/dev/null | grep licenses.db || echo "none found via lsof"
            echo "=== Resetting HWID in ALL DBs ==="
            for DB in $(find / -name "licenses.db" 2>/dev/null); do
              echo "Processing: $DB"
              sqlite3 "$DB" "UPDATE licenses SET hwid='' WHERE key='FMSND-U5DIXQ-7B6M84-GTA1NQ-YQ1ITF';" 2>/dev/null && echo "  -> updated" || echo "  -> failed"
              sqlite3 "$DB" "SELECT key, hwid, is_active, expires_at FROM licenses WHERE key='FMSND-U5DIXQ-7B6M84-GTA1NQ-YQ1ITF';" 2>/dev/null
            done
            echo "=== Done. Restarting service ==="
            systemctl restart fmailsender 2>/dev/null || true
