name: Admin DB Fix
on:
  workflow_dispatch:
jobs:
  db-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Reset HWID on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 31.76.100.190
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            DB=$(find /opt /home /root /srv -name "licenses.db" 2>/dev/null | head -1)
            echo "DB: $DB"
            sqlite3 "$DB" "SELECT key, hwid, plan, expires_at FROM licenses WHERE key='FMSND-U5DIXQ-7B6M84-GTA1NQ-YQ1ITF';"
            sqlite3 "$DB" "UPDATE licenses SET hwid='' WHERE key='FMSND-U5DIXQ-7B6M84-GTA1NQ-YQ1ITF';"
            echo "HWID reset done."
            sqlite3 "$DB" "SELECT key, hwid FROM licenses WHERE key='FMSND-U5DIXQ-7B6M84-GTA1NQ-YQ1ITF';"
