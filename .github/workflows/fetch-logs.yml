name: Fetch Bot Logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Get bot logs from VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 30s
          script: |
            echo '=== SERVICE STATUS ==='
            systemctl status fmailsender --no-pager -l || true
            echo '=== LAST 80 LOG LINES ==='
            journalctl -u fmailsender -n 80 --no-pager || true
            echo '=== PYTHON SYNTAX CHECK ==='
            cd /opt/fmailsender
            venv/bin/python -m py_compile server/bot.py && echo 'SYNTAX OK' || echo 'SYNTAX ERROR'
            echo '=== DONE ==='