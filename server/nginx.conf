# Nginx конфиг для fmail.shop
# Размести в: /etc/nginx/sites-available/fmail.shop
# Включи: ln -sf /etc/nginx/sites-available/fmail.shop /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d fmail.shop -d www.fmail.shop

server {
    listen 80;
    listen [::]:80;
    server_name fmail.shop www.fmail.shop;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fmail.shop www.fmail.shop;

    # SSL сертификаты (Let's Encrypt через certbot)
    ssl_certificate     /etc/letsencrypt/live/fmail.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fmail.shop/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fmail.shop/chain.pem;

    # Современные SSL настройки
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Проксируем все запросы к FastAPI серверу (uvicorn на localhost:8000)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 512m;
    }

    # Статические файлы (если нужно)
    location /static/ {
        alias /opt/fmailsender/server/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Логи
    access_log /var/log/nginx/fmail.shop.access.log;
    error_log  /var/log/nginx/fmail.shop.error.log;
}
