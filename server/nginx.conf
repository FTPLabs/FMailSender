# Nginx конфиг для fmail.shop
  # Размести в: /etc/nginx/sites-available/fmail.shop
  # Включи: ln -sf /etc/nginx/sites-available/fmail.shop /etc/nginx/sites-enabled/
  # SSL: certbot --nginx -d fmail.shop -d www.fmail.shop

  # ── Rate limiting зоны (объявляются на уровне http-блока) ────────────────────
  # ВАЖНО: эти директивы должны быть внутри блока http {} в nginx.conf,
  # а не в sites-available. Если используешь include, добавь их в /etc/nginx/nginx.conf:
  #
  #   limit_req_zone $binary_remote_addr zone=api_verify:10m   rate=10r/m;
  #   limit_req_zone $binary_remote_addr zone=api_activate:10m rate=3r/m;
  #   limit_req_zone $binary_remote_addr zone=api_download:10m rate=20r/m;
  #   limit_req_zone $binary_remote_addr zone=admin_panel:10m  rate=20r/h;
  #   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  server {
      listen 80;
      listen [::]:80;
      server_name fmail.shop www.fmail.shop;

      # Certbot ACME challenge
      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      # Всё остальное — редирект на HTTPS
      location / {
          return 301 https://$host$request_uri;
      }
  }

  server {
      listen 443 ssl http2;
      listen [::]:443 ssl http2;
      server_name fmail.shop www.fmail.shop;

      # SSL сертификаты (Let's Encrypt через certbot)
      ssl_certificate     /etc/letsencrypt/live/fmail.shop/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/fmail.shop/privkey.pem;
      ssl_trusted_certificate /etc/letsencrypt/live/fmail.shop/chain.pem;

      # Современные SSL настройки
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
      ssl_prefer_server_ciphers off;
      ssl_session_cache   shared:SSL:10m;
      ssl_session_timeout 1d;
      ssl_stapling        on;
      ssl_stapling_verify on;
      resolver            1.1.1.1 8.8.8.8 valid=300s;
      resolver_timeout    5s;

      # Security headers
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-XSS-Protection "1; mode=block" always;

      # ── Rate Limiting: /v1/verify — max 10 запросов/минуту с одного IP ──────
      # Защита от brute-force перебора ключей лицензий
      location /v1/verify {
          limit_req zone=api_verify burst=5 nodelay;
          limit_req_status 429;
          limit_conn conn_limit 10;

          proxy_pass         http://127.0.0.1:8000;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_read_timeout 30s;
          proxy_send_timeout 30s;
      }

      # ── Rate Limiting: /v1/activate — max 3 запроса/минуту с одного IP ──────
      # Жёсткое ограничение — активация ключа не должна делаться в цикле
      location /v1/activate {
          limit_req zone=api_activate burst=2 nodelay;
          limit_req_status 429;
          limit_conn conn_limit 5;

          proxy_pass         http://127.0.0.1:8000;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_read_timeout 30s;
          proxy_send_timeout 30s;
      }

      # ── Rate Limiting: /v1/download — max 20 загрузок/минуту с одного IP ────
      location /v1/download {
          limit_req zone=api_download burst=5 nodelay;
          limit_req_status 429;

          proxy_pass         http://127.0.0.1:8000;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_read_timeout 120s;
          proxy_send_timeout 120s;
          client_max_body_size 512m;
      }

      # ── Rate Limiting: /admin — max 20 запросов/час с одного IP ─────────────
      # Защита от перебора admin api_key
      location /admin {
          limit_req zone=admin_panel burst=5 nodelay;
          limit_req_status 429;

          proxy_pass         http://127.0.0.1:8000;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_read_timeout 60s;
          proxy_send_timeout 60s;
      }

      # ── Прочие запросы к FastAPI (uvicorn на localhost:8000) ─────────────────
      location / {
          proxy_pass         http://127.0.0.1:8000;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_set_header   Upgrade           $http_upgrade;
          proxy_set_header   Connection        "upgrade";
          proxy_read_timeout 120s;
          proxy_send_timeout 120s;
          client_max_body_size 512m;
      }

      # Статические файлы
      location /static/ {
          alias /opt/fmailsender/server/static/;
          expires 30d;
          add_header Cache-Control "public, immutable";
      }

      # Логи (api_key из URL НЕ попадает в access_log через sanitized формат)
      log_format sanitized '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

      access_log /var/log/nginx/fmail.shop.access.log sanitized;
      error_log  /var/log/nginx/fmail.shop.error.log;
  }
  