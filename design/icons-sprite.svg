<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- FMail Sender Icon Sprite — все иконки используют currentColor, stroke-width ~1.2-1.4 -->

  <symbol id="icon-dashboard" viewBox="0 0 15 15" fill="none">
    <rect x="1" y="1" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
    <rect x="8.5" y="1" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
    <rect x="1" y="8.5" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
    <rect x="8.5" y="8.5" width="5.5" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <symbol id="icon-accounts" viewBox="0 0 15 15" fill="none">
    <circle cx="7.5" cy="5" r="3" stroke="currentColor" stroke-width="1.2"/>
    <path d="M1.5 13c0-3.314 2.686-5.5 6-5.5s6 2.186 6 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-recipients" viewBox="0 0 15 15" fill="none">
    <circle cx="4.5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="10.5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.2"/>
    <path d="M1 13c0-2.761 1.567-4 3.5-4s3.5 1.239 3.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M9 10.5c.6-.33 1.25-.5 1.5-.5 1.933 0 3.5 1.239 3.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-compose" viewBox="0 0 15 15" fill="none">
    <rect x="1" y="2.5" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
    <path d="M1 5.5l6.5 4.5 6.5-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-sending" viewBox="0 0 15 15" fill="none">
    <path d="M13.5 1.5L1 6l5 2.5 1.5 5.5 6-12.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M6 8.5L9.5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-inbox" viewBox="0 0 15 15" fill="none">
    <rect x="1" y="2" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
    <path d="M1 9.5h3l1.5 2h4L11 9.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-plus" viewBox="0 0 13 13" fill="none">
    <path d="M6.5 1.5v10M1.5 6.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-upload" viewBox="0 0 13 13" fill="none">
    <path d="M6.5 8.5V2M4 4.5l2.5-2.5 2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 10.5h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-check" viewBox="0 0 12 12" fill="none">
    <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-x" viewBox="0 0 12 12" fill="none">
    <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-trash" viewBox="0 0 13 13" fill="none">
    <path d="M2 4h9M5 4V2.5h3V4M4.5 6v4M8.5 6v4M3 4l.8 7.5h5.4L10 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-key" viewBox="0 0 14 14" fill="none">
    <circle cx="5" cy="7" r="3" stroke="currentColor" stroke-width="1.2"/>
    <path d="M8 7h4.5M10.5 5.5V7M12.5 5.5V7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-settings" viewBox="0 0 13 13" fill="none">
    <circle cx="6.5" cy="6.5" r="2" stroke="currentColor" stroke-width="1.2"/>
    <path d="M6.5 1v1.5M6.5 10.5V12M1 6.5h1.5M10.5 6.5H12M2.636 2.636l1.06 1.06M9.304 9.304l1.06 1.06M2.636 10.364l1.06-1.06M9.304 3.696l1.06-1.06" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-mail" viewBox="0 0 20 20" fill="none">
    <rect x="2" y="4.5" width="16" height="11" rx="1.8" stroke="white" stroke-width="1.5"/>
    <path d="M2 8l8 5 8-5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-play" viewBox="0 0 13 13" fill="none">
    <path d="M3 2l8 4.5L3 11V2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-pause" viewBox="0 0 13 13" fill="none">
    <path d="M4 2.5v8M9 2.5v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-stop" viewBox="0 0 13 13" fill="none">
    <rect x="2.5" y="2.5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <symbol id="icon-clock" viewBox="0 0 13 13" fill="none">
    <circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" stroke-width="1.2"/>
    <path d="M6.5 3.5V7l2.5 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-reply" viewBox="0 0 13 13" fill="none">
    <path d="M4 4L1 7l3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1 7h7a4 4 0 0 1 4 4v1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-attach" viewBox="0 0 13 13" fill="none">
    <path d="M11 6L6 11a3.5 3.5 0 0 1-5-5l5.5-5.5a2.5 2.5 0 0 1 3.5 3.5L5 9.5a1.5 1.5 0 0 1-2-2L8 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-spam" viewBox="0 0 13 13" fill="none">
    <circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" stroke-width="1.2"/>
    <path d="M6.5 3.5v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="6.5" cy="9.5" r="0.7" fill="currentColor"/>
  </symbol>

  <symbol id="icon-lightning" viewBox="0 0 14 14" fill="none">
    <path d="M8 1L2 8h5l-1 5 6-7H7L8 1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-arrow" viewBox="0 0 12 12" fill="none">
    <path d="M2.5 6h7M6.5 3l3.5 3-3.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-download" viewBox="0 0 13 13" fill="none">
    <path d="M6.5 2v7M4 7l2.5 2.5L9 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 10.5h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-filter" viewBox="0 0 13 13" fill="none">
    <path d="M1.5 3.5h10M3.5 6.5h6M5.5 9.5h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="icon-template" viewBox="0 0 13 13" fill="none">
    <rect x="1" y="1" width="11" height="11" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
    <path d="M4 1v11M1 4.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
</svg>

<!--
  Использование в HTML:
  <svg><use href="#icon-dashboard"/></svg>

  Пример с цветом и размером:
  <svg width="15" height="15" style="color: #8b5cf6"><use href="#icon-sending"/></svg>
-->
