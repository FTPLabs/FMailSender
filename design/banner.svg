<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="gf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="card-clip">
      <rect x="760" y="60" width="380" height="280" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="200" rx="320" ry="200" fill="url(#glow1)" filter="url(#gf)"/>
  <ellipse cx="1000" cy="200" rx="280" ry="180" fill="url(#glow2)" filter="url(#gf)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Logo icon -->
  <rect x="60" y="138" width="64" height="64" rx="16" fill="url(#logoGrad)" filter="url(#shadow)"/>
  <rect x="60" y="138" width="64" height="64" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Mail icon inside logo -->
  <rect x="74" y="152" width="36" height="26" rx="4" fill="none" stroke="white" stroke-width="2"/>
  <path d="M74 157l18 11 18-11" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Logo glow -->
  <ellipse cx="92" cy="170" rx="36" ry="24" fill="#7c3aed" fill-opacity="0.25" filter="url(#gf)"/>

  <!-- Title -->
  <text x="144" y="168" font-family="'Inter', system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">FMail Sender</text>

  <!-- Version badge -->
  <rect x="144" y="178" width="54" height="18" rx="9" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <text x="171" y="190" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#8b5cf6" text-anchor="middle" letter-spacing="0.04em">v3.5.5</text>

  <!-- Tagline -->
  <text x="144" y="226" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="0.01em">Профессиональная почтовая рассылка</text>

  <!-- Feature pills -->
  <g>
    <!-- Pill 1 -->
    <rect x="60" y="258" width="130" height="28" rx="14" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
    <circle cx="81" cy="272" r="4" fill="#22c55e"/>
    <text x="93" y="277" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#22c55e">SMTP Ротация</text>

    <!-- Pill 2 -->
    <rect x="204" y="258" width="120" height="28" rx="14" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
    <circle cx="222" cy="272" r="4" fill="#3b82f6"/>
    <text x="234" y="277" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#3b82f6">Anti-Spam</text>

    <!-- Pill 3 -->
    <rect x="338" y="258" width="130" height="28" rx="14" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <circle cx="357" cy="272" r="4" fill="#8b5cf6"/>
    <text x="369" y="277" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8b5cf6">HWID Лицензия</text>
  </g>

  <!-- Right side — UI card mockup -->
  <rect x="760" y="60" width="380" height="280" rx="16" fill="#0d1117" stroke="rgba(255,255,255,0.07)" stroke-width="1" filter="url(#shadow)"/>

  <!-- Card header -->
  <rect x="760" y="60" width="380" height="42" rx="0" fill="#12171f"/>
  <rect x="760" y="60" width="380" height="42" rx="16" fill="#12171f"/>
  <rect x="760" y="84" width="380" height="18" fill="#12171f"/>
  <text x="782" y="87" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Дашборд</text>
  <!-- Status dot -->
  <circle cx="1112" cy="81" r="4" fill="#22c55e"/>
  <text x="1122" y="85" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#22c55e">Live</text>

  <!-- Divider -->
  <line x1="760" y1="102" x2="1140" y2="102" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Stat cards row -->
  <g>
    <!-- Card 1 -->
    <rect x="774" y="112" width="82" height="56" rx="8" fill="#07090f" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
    <text x="784" y="128" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="600" fill="rgba(139,92,246,0.7)" letter-spacing="0.06em">ОТПРАВЛЕНО</text>
    <text x="784" y="148" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#8b5cf6">4 607</text>
    <text x="784" y="160" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">сегодня</text>

    <!-- Card 2 -->
    <rect x="864" y="112" width="82" height="56" rx="8" fill="#07090f" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
    <text x="874" y="128" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="600" fill="rgba(34,197,94,0.7)" letter-spacing="0.06em">УСПЕШНО</text>
    <text x="874" y="148" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#22c55e">4 430</text>
    <text x="874" y="160" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">96.2%</text>

    <!-- Card 3 -->
    <rect x="954" y="112" width="82" height="56" rx="8" fill="#07090f" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
    <text x="964" y="128" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="600" fill="rgba(239,68,68,0.7)" letter-spacing="0.06em">ОШИБОК</text>
    <text x="964" y="148" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ef4444">177</text>
    <text x="964" y="160" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">3.8%</text>

    <!-- Card 4 -->
    <rect x="1044" y="112" width="82" height="56" rx="8" fill="#07090f" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
    <text x="1054" y="128" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="600" fill="rgba(59,130,246,0.7)" letter-spacing="0.06em">СКОРОСТЬ</text>
    <text x="1054" y="148" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#3b82f6">847</text>
    <text x="1054" y="160" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.35)">/мин</text>
  </g>

  <!-- Progress bar section -->
  <rect x="774" y="180" width="352" height="56" rx="8" fill="#07090f" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="784" y="196" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="0.07em">ПРОГРЕСС РАССЫЛКИ</text>
  <text x="1106" y="196" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#8b5cf6" text-anchor="end">37.4%</text>
  <!-- Bar track -->
  <rect x="784" y="202" width="332" height="5" rx="3" fill="rgba(255,255,255,0.06)"/>
  <!-- Bar fill -->
  <rect x="784" y="202" width="124" height="5" rx="3" fill="url(#barGrad)"/>
  <text x="784" y="224" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">4 607 / 12 450 писем</text>
  <text x="1106" y="224" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="end">~9 мин. осталось</text>

  <!-- Log preview -->
  <rect x="774" y="248" width="352" height="76" rx="8" fill="#07090f" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="784" y="264" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="0.07em">ЛОГ</text>
  <circle cx="1116" cy="260" r="3" fill="#22c55e"/>
  <!-- Log rows -->
  <text x="784" y="280" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
  <text x="796" y="280" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">14:22:03  user@gmail.com  ← smtp1@fmail.shop</text>
  <text x="784" y="294" font-family="monospace" font-size="9" fill="#22c55e">✓</text>
  <text x="796" y="294" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">14:22:04  client@yandex.ru  ← smtp2@fmail.shop</text>
  <text x="784" y="308" font-family="monospace" font-size="9" fill="#ef4444">✗</text>
  <text x="796" y="308" font-family="monospace" font-size="9" fill="#ef444488">14:22:05  bad@invalid.com  × AUTH_FAIL</text>

  <!-- Bottom gradient overlay on card -->
  <defs>
    <linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Accent line at bottom -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#barGrad)" opacity="0.7"/>
</svg>
