<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle grid -->
  <g clip-path="url(#rounded)">
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
    </g>

    <!-- Glow orb -->
    <ellipse cx="256" cy="220" rx="180" ry="120" fill="rgba(255,255,255,0.08)"/>

    <!-- Mail envelope body -->
    <rect x="112" y="168" width="288" height="196" rx="24" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>

    <!-- Envelope flap (V shape) -->
    <path d="M112 192 L256 286 L400 192" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom fold lines -->
    <path d="M112 364 L196 280" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
    <path d="M400 364 L316 280" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>

    <!-- Lightning bolt accent -->
    <path d="M244 212 L228 252 H248 L232 292" stroke="rgba(255,255,255,0.85)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Shine overlay -->
    <rect width="512" height="512" rx="120" fill="url(#shine)"/>

    <!-- Border -->
    <rect width="512" height="512" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  </g>
</svg>
